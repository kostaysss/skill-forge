<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Логотип — новые варианты</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--void:#0b0a0d;--bone:#edeae6;--ash:#a89fa8;--signal:#ff5e1a;--ember:#ffb020;
    --fd:'Oswald',sans-serif;--fm:'JetBrains Mono',monospace;--fb:'Inter',sans-serif;}
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(1100px 600px at 30% -10%,#1c1420,#0b0a0d 55%);color:var(--bone);font-family:var(--fb);padding:40px 24px 90px;}
  .wrap{max-width:940px;margin:0 auto;}
  h1{font-family:var(--fd);font-size:25px;margin:0 0 6px;}
  .lead{color:var(--ash);font-size:14px;margin:0 0 30px;}
  .row{margin-bottom:18px;border:1px solid rgba(237,234,230,.1);border-radius:16px;background:rgba(20,18,24,.4);overflow:hidden;}
  .rh{display:flex;align-items:center;gap:10px;padding:12px 18px 6px;}
  .rh .n{font-family:var(--fm);font-size:12px;font-weight:700;color:var(--void);background:var(--ember);border-radius:6px;padding:2px 8px;}
  .rh h2{font-family:var(--fd);font-size:16px;margin:0;}
  .rd{color:var(--ash);font-size:12px;padding:0 18px 12px;line-height:1.4;}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:linear-gradient(180deg,#141017,#0d0b11);border-top:1px solid rgba(237,234,230,.06);}
  .chip{font-family:var(--fm);font-size:10px;color:var(--ash);border:1px solid rgba(237,234,230,.14);border-radius:20px;padding:6px 12px;}
  .big{display:flex;align-items:center;justify-content:center;padding:30px;background:radial-gradient(400px 200px at 50% 0,rgba(255,94,26,.06),transparent 60%);}
  .big .brand{transform:scale(1.8);}
  .brand{display:inline-flex;align-items:center;gap:11px;text-decoration:none;}
  .brand-mark{width:38px;height:38px;flex:none;display:block;}
  .bw{font-family:var(--fd);font-weight:600;font-size:21px;letter-spacing:.02em;color:var(--bone);display:inline-flex;align-items:center;gap:3px;line-height:1;}
  .bw .grad{background:linear-gradient(100deg,var(--signal),var(--ember));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .bw.tracked{letter-spacing:.14em;font-weight:500;}
  .glow{filter:drop-shadow(0 0 7px rgba(255,94,26,.45));}
  .oT{display:inline-block;vertical-align:-2px;margin:0 1px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Логотип Skill Forge — новая подборка</h1>
  <p class="lead">Более креативные концепты (не типовой прицел). Скажи номер или «значок из X + текст из Y».</p>
  <div id="root"></div>
</div>
<script>
function gv(id){return '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5e1a"/><stop offset="1" stop-color="#ffb020"/></linearGradient></defs>';}
function gd(id){return '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd35a"/><stop offset=".5" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ff3d1a"/></linearGradient></defs>';}

var MARKS={
  /* 1 Molten Hex — glowing forged core */
  hexcore:'<svg class="brand-mark glow" viewBox="0 0 40 40" fill="none">'+gd('n1')+
    '<path d="M20 3.5 L33.5 11.25 V26.75 L20 34.5 L6.5 26.75 V11.25 Z" stroke="#ff5e1a" stroke-width="2" opacity=".5"/>'+
    '<path d="M20 11 L27 15 V23 L20 27 L13 23 V15 Z" fill="url(#n1)"/>'+
    '<path d="M20 15 L23.5 17 V21 L20 23 L16.5 21 V17 Z" fill="#0d0b11" opacity=".35"/></svg>',
  /* 2 Rank-up chevrons (flame/level) */
  chev:'<svg class="brand-mark glow" viewBox="0 0 40 40" fill="none">'+gd('n2')+
    '<path d="M20 4 L33 18 H26 L20 12 L14 18 H7 Z" fill="url(#n2)"/>'+
    '<path d="M20 17 L33 31 H26 L20 25 L14 31 H7 Z" fill="url(#n2)" opacity=".7"/></svg>',
  /* 3 Forged ingot / gem with glint */
  gem:'<svg class="brand-mark glow" viewBox="0 0 40 40" fill="none">'+gv('n3')+
    '<path d="M11 8 H29 L35 16 L20 34 L5 16 Z" fill="url(#n3)"/>'+
    '<path d="M11 8 L15 16 H5 M29 8 L25 16 H35 M15 16 L20 34 L25 16 M11 8 L20 34 M29 8 L20 34" stroke="#0d0b11" stroke-width="1" opacity=".28" fill="none"/>'+
    '<path d="M22 11 l1.4 3 3 .6 -2.4 2 .6 3 -2.6-1.5" fill="#fff" opacity=".85"/></svg>',
  /* 4 Duo diamond — two teammates / unity */
  duo:'<svg class="brand-mark glow" viewBox="0 0 40 40" fill="none">'+gv('n4')+
    '<path d="M20 3 L35 20 L20 20 Z" fill="url(#n4)"/>'+
    '<path d="M20 37 L5 20 L20 20 Z" fill="url(#n4)" opacity=".62"/>'+
    '<path d="M20 3 L20 37" stroke="#0d0b11" stroke-width="1.3" opacity=".4"/>'+
    '<circle cx="20" cy="20" r="2.3" fill="#fff"/></svg>',
  /* 5 Anvil + spark (literal forge) */
  anvil:'<svg class="brand-mark glow" viewBox="0 0 40 40" fill="none">'+gv('n5')+
    '<path d="M8 16 H30 C30 20 27 22 23 22 V26 H26 V29 H14 V26 H17 V22 C13 22 10 21 8 18 Z" fill="url(#n5)"/>'+
    '<path d="M18 8 h9 v3 h-3 l4 4" stroke="url(#n5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>'+
    '<path d="M30 7 l1.1 3 3 1.1 -3 1.1 -1.1 3 -1.1-3 -3-1.1 3-1.1 z" fill="#ffd35a"/></svg>',
  /* 6 for wordmark-integrated (target O), tiny mark not used */
  none:''
};

var WM={
  grad:'<span class="bw">SKILL <span class="grad">FORGE</span></span>',
  tight:'<span class="bw">SKILL<span class="grad">FORGE</span></span>',
  /* target-O wordmark */
  targetO:'<span class="bw tracked">SKILL F'+
    '<svg class="oT" width="19" height="19" viewBox="0 0 24 24" fill="none">'+gv('o1')+
    '<circle cx="12" cy="12" r="8" stroke="url(#o1)" stroke-width="2.4"/><circle cx="12" cy="12" r="2.6" fill="url(#o1)"/></svg>'+
    'RGE</span>'
};

var V=[
  {n:'1',t:'Molten Hex — раскалённое ядро',d:'Гексагон с горящим градиентным ядром внутри — будто смотришь в кузнечный горн. Геометрично, премиально, отлично масштабируется в иконку.',mark:'hexcore',wm:'grad'},
  {n:'2',t:'Rank-Up Chevrons — рост/пламя',d:'Две восходящие «шевроны» — одновременно язык пламени и рост ранга. Динамика вверх, минимализм, легко узнаётся.',mark:'chev',wm:'grad'},
  {n:'3',t:'Forged Gem — кристалл с бликом',d:'«Выкованный» кристалл/слиток с гранями и бликом-искрой. Дорогой, ювелирный вид, самобытный.',mark:'gem',wm:'tight'},
  {n:'4',t:'Duo Diamond — двое в одном',d:'Два зеркальных клина складываются в ромб — метафора «нашёл напарника, стали единым». Смысловой и стильный.',mark:'duo',wm:'grad'},
  {n:'5',t:'Anvil + Spark — кузница буквально',d:'Наковальня с молотом и искрой — прямая отсылка к Forge. Тёплый, характерный, ни у кого такого нет.',mark:'anvil',wm:'grad'},
  {n:'6',t:'Type-led — буква O как прицел',d:'Логотип из самого текста: «O» в FORGE заменена на аккуратный прицел-мишень. Чистый типографский вид — часто читается дороже всего.',mark:'none',wm:'targetO'}
];
document.getElementById('root').innerHTML=V.map(function(v){
  var brand='<a class="brand">'+(MARKS[v.mark]||'')+WM[v.wm]+'</a>';
  return '<div class="row"><div class="rh"><span class="n">'+v.n+'</span><h2>'+v.t+'</h2></div><div class="rd">'+v.d+'</div>'+
    '<div class="nav">'+brand+'<span class="chip">Войти / Регистрация</span></div>'+
    '<div class="big">'+brand+'</div></div>';
}).join('');
</script>
</body>
</html>
