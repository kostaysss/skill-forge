<style>
  :root{
    --void:#0b0a0d; --gunmetal:#17151a; --gunmetal-2:#211d24; --steel:#4a454e;
    --bone:#edeae6; --ash:#a89fa8; --signal:#ff5e1a; --ember:#ffb020; --intel:#2fe0a8;
    --grid-line: rgba(237,234,230,0.05);
    --font-display: "Arial Black","Haettenschweiler","Franklin Gothic Bold","Segoe UI",sans-serif;
    --font-body: -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-mono: "SF Mono","Cascadia Code","Consolas","Roboto Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:radial-gradient(150% 120% at 50% 38%, #100c13 42%, #08070b 100%), var(--void);background-attachment:fixed;color:var(--bone);font-family:var(--font-body);line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  ::selection{background:var(--signal);color:var(--void);}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ember);outline-offset:2px;}

  .bg-topo{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:0.22;}
  .bg-topo svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .ember-global{position:fixed;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none;}

  .wrap{max-width:1080px;margin:0 auto;padding:0 clamp(20px,4vw,40px);}

  .btn{font-family:var(--font-mono);font-size:12.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;text-decoration:none;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:9px;padding:12px 22px;border-radius:999px;transition:transform .15s ease, filter .15s ease, border-color .15s ease, background .15s ease;}
  .btn:hover{transform:translateY(-2px);}
  .btn-primary{background:rgba(255,255,255,0.05);color:var(--bone);border:1px solid rgba(255,255,255,0.34);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);box-shadow:inset 0 1px 0 rgba(255,255,255,0.5), inset 0 0 22px rgba(255,255,255,0.05), 0 8px 24px -12px rgba(255,94,26,0.35);}
  .btn-primary:hover{background:rgba(255,94,26,0.16);border-color:rgba(255,255,255,0.55);}
  .btn-ghost{background:rgba(255,255,255,0.04);color:var(--bone);border:1px solid rgba(255,255,255,0.22);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);box-shadow:inset 0 1px 0 rgba(255,255,255,0.28);}
  .btn-ghost:hover{border-color:rgba(255,94,26,0.6);background:rgba(255,255,255,0.1);color:var(--bone);}

  .nav{position:sticky;top:0;z-index:200;background:rgba(11,10,13,0.86);backdrop-filter:blur(10px);border-bottom:1px solid rgba(237,234,230,0.08);}
  .nav .wrap{display:flex;align-items:center;justify-content:space-between;height:72px;max-width:1180px;}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
  .brand svg{width:32px;height:32px;}
  .brand-word{font-family:var(--font-display);font-size:18px;color:var(--bone);display:flex;align-items:center;gap:6px;}
  .brand-word .tag{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:0.1em;color:var(--signal);border:1px solid var(--signal);border-radius:999px;padding:3px 8px;}

  main{padding:38px 0 90px;position:relative;z-index:1;}
  .page-title{font-family:var(--font-display);font-size:clamp(24px,3.4vw,36px);text-transform:uppercase;margin:0 0 22px;}
  .page-title .accent{background:linear-gradient(100deg,var(--signal),var(--ember));-webkit-background-clip:text;background-clip:text;color:transparent;}

  /* tabs */
  .tabs{display:flex;gap:12px;margin-bottom:26px;flex-wrap:wrap;}
  .tab{
    font-family:var(--font-mono);font-size:13px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;
    display:inline-flex;align-items:center;gap:9px;cursor:pointer;
    padding:12px 22px;border-radius:12px;border:1px solid rgba(237,234,230,0.1);
    background:linear-gradient(160deg, rgba(33,29,36,0.6), rgba(17,15,19,0.85));color:var(--ash);
    transition:transform .18s ease, border-color .18s ease, color .18s ease, background .18s ease;
  }
  .tab svg{width:17px;height:17px;}
  .tab:hover{transform:translateY(-2px);color:var(--bone);border-color:rgba(255,94,26,0.4);}
  .tab.active{background:linear-gradient(120deg,var(--signal),var(--ember));color:var(--void);border-color:transparent;box-shadow:0 12px 26px -12px rgba(255,94,26,0.6);}
  .tabpanel{display:none;animation:fadeIn .35s ease;}
  .tabpanel.active{display:block;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  .glass{background:linear-gradient(160deg, rgba(40,35,46,0.42), rgba(14,12,18,0.6));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.12);border-radius:20px;box-shadow:0 26px 60px -25px rgba(0,0,0,0.85), inset 0 1px 0 rgba(255,255,255,0.14);}

  /* profile card */
  .profile-top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:24px 26px;border-bottom:1px solid rgba(237,234,230,0.08);flex-wrap:wrap;}
  .who{display:flex;align-items:center;gap:16px;}
  .avatar{width:64px;height:64px;border-radius:16px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:26px;color:var(--void);background:linear-gradient(135deg,var(--signal),var(--ember));box-shadow:0 0 22px rgba(255,94,26,0.3);}
  .avatar.has-photo{background-size:cover;background-position:center;color:transparent;}

  .photo-up{display:flex;align-items:center;gap:12px;}
  .photo-thumb{width:50px;height:50px;border-radius:12px;flex:none;background:rgba(11,10,13,0.6) center/cover no-repeat;border:1px solid rgba(237,234,230,0.14);}
  .photo-pick{font-family:var(--font-mono);font-size:12px;letter-spacing:0.05em;text-transform:uppercase;color:var(--bone);background:var(--gunmetal-2);border:1px solid var(--steel);border-radius:999px;padding:9px 16px;cursor:pointer;transition:border-color .15s ease;}
  .photo-pick:hover{border-color:var(--signal);}
  .who .nm{font-family:var(--font-display);font-size:24px;line-height:1;}
  .who .rl{font-family:var(--font-mono);font-size:12px;color:var(--signal);text-transform:uppercase;letter-spacing:0.05em;margin-top:6px;display:inline-block;border:1px solid rgba(255,94,26,0.4);border-radius:999px;padding:3px 10px;}

  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;background:rgba(237,234,230,0.06);}
  @media(max-width:620px){.grid2{grid-template-columns:1fr;}}
  .drow{background:rgba(10,9,13,0.55);padding:16px 26px;display:flex;flex-direction:column;gap:4px;}
  .drow .k{font-family:var(--font-mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--steel);}
  .drow .v{font-size:15px;color:var(--bone);word-break:break-word;}
  .drow .v.empty{color:var(--steel);font-style:italic;}
  .drow input, .drow select{
    font-family:var(--font-body);font-size:14px;color:var(--bone);
    background:rgba(11,10,13,0.72);border:1px solid rgba(237,234,230,0.14);border-radius:8px;padding:8px 11px;outline:none;width:100%;
    transition:border-color .15s ease;
  }
  .drow input:focus, .drow select:focus{border-color:var(--signal);}

  .card-actions2{display:flex;gap:12px;padding:20px 26px;flex-wrap:wrap;}

  .empty-state{text-align:center;padding:60px 24px;}
  .empty-state .es-ico{width:70px;height:70px;border-radius:18px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,rgba(255,94,26,0.2),rgba(255,176,32,0.06));border:1px solid rgba(255,94,26,0.3);color:var(--ember);}
  .empty-state .es-ico svg{width:34px;height:34px;}
  .empty-state h3{font-family:var(--font-display);text-transform:uppercase;font-size:20px;margin:0 0 8px;}
  .empty-state p{color:var(--ash);margin:0 0 22px;}

  /* search toolbar */
  .search-toolbar{margin-bottom:20px;}
  .sb-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
  .sb-search{flex:1 1 240px;display:flex;align-items:center;gap:9px;background:rgba(20,18,24,0.7);border:1px solid rgba(237,234,230,0.12);border-radius:12px;padding:0 14px;transition:border-color .15s ease;}
  .sb-search:focus-within{border-color:var(--signal);}
  .sb-search svg{width:17px;height:17px;color:var(--steel);flex:none;}
  .sb-search input{flex:1;background:none;border:none;outline:none;color:var(--bone);font-family:var(--font-body);font-size:14px;padding:12px 0;}
  .sb-search input::placeholder{color:var(--steel);}
  .sb-select{appearance:none;font-family:var(--font-mono);font-size:12px;letter-spacing:0.03em;color:var(--bone);background:rgba(20,18,24,0.7);border:1px solid rgba(237,234,230,0.12);border-radius:10px;padding:10px 30px 10px 13px;cursor:pointer;transition:border-color .15s ease;
    background-image:linear-gradient(45deg,transparent 50%,var(--ash) 50%),linear-gradient(135deg,var(--ash) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
  .sb-select:hover,.sb-select:focus{border-color:var(--signal);outline:none;}
  .sb-toggle{font-family:var(--font-mono);font-size:11.5px;letter-spacing:0.04em;text-transform:uppercase;cursor:pointer;padding:9px 14px;border-radius:10px;border:1px solid rgba(237,234,230,0.14);background:rgba(20,18,24,0.6);color:var(--ash);transition:all .15s ease;display:inline-flex;align-items:center;gap:7px;}
  .sb-toggle:hover{border-color:rgba(255,94,26,0.5);color:var(--bone);}
  .sb-toggle.active{background:linear-gradient(120deg,var(--signal),var(--ember));color:var(--void);border-color:transparent;}
  .sb-toggle .dot{width:7px;height:7px;border-radius:50%;background:var(--intel);box-shadow:0 0 7px 1px rgba(47,224,168,0.7);}
  .sb-count{font-family:var(--font-mono);font-size:12px;color:var(--ash);}
  .sb-count b{color:var(--bone);}

  /* compatibility badge */
  .compat{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:11px;letter-spacing:0.04em;text-transform:uppercase;border-radius:999px;padding:5px 11px;margin-bottom:13px;}
  .compat .cnum{font-weight:700;}
  .compat.c-hi{color:var(--intel);border:1px solid rgba(47,224,168,0.4);background:rgba(47,224,168,0.08);}
  .compat.c-mid{color:var(--ember);border:1px solid rgba(255,176,32,0.4);background:rgba(255,176,32,0.08);}
  .compat.c-lo{color:var(--ash);border:1px solid rgba(237,234,230,0.14);background:rgba(237,234,230,0.04);}

  /* save-to-squad button */
  .save-btn{width:40px;height:40px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(237,234,230,0.14);background:rgba(11,10,13,0.6);color:var(--ash);cursor:pointer;transition:transform .16s ease,border-color .16s ease,color .16s ease,background .16s ease;}
  .save-btn svg{width:18px;height:18px;}
  .save-btn:hover{border-color:var(--ember);color:var(--ember);transform:scale(1.07);}
  .save-btn.saved{background:linear-gradient(120deg,var(--ember),#ffce6b);border-color:transparent;color:var(--void);}
  @keyframes shake{10%,90%{transform:translateX(-1px);}30%,70%{transform:translateX(2px);}50%{transform:translateX(-3px);}}
  .save-btn.shake{animation:shake .4s;}

  /* squad coverage panel */
  .squad-cover{padding:18px 20px;margin-bottom:18px;}
  .squad-cover .sc-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .squad-cover .sc-title{font-family:var(--font-display);text-transform:uppercase;font-size:16px;}
  .squad-cover .sc-count{font-family:var(--font-mono);font-size:12px;color:var(--ash);}
  .squad-cover .sc-count b{color:var(--ember);}
  .role-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  @media(max-width:520px){.role-slots{grid-template-columns:repeat(2,1fr);}}
  .role-slot{border-radius:12px;padding:12px;text-align:center;border:1px dashed rgba(237,234,230,0.16);background:rgba(11,10,13,0.4);transition:all .2s ease;}
  .role-slot .rs-role{font-family:var(--font-mono);font-size:12px;letter-spacing:0.04em;text-transform:uppercase;color:var(--steel);}
  .role-slot .rs-nick{font-size:13px;color:var(--bone);margin-top:5px;min-height:16px;}
  .role-slot.filled{border-style:solid;border-color:rgba(47,224,168,0.45);background:rgba(47,224,168,0.06);}
  .role-slot.filled .rs-role{color:var(--intel);}
  .sc-hint{font-family:var(--font-mono);font-size:12px;color:var(--ember);margin-top:14px;}
  .sc-hint.full{color:var(--intel);}

  /* players search */
  .search-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
  .search-head p{color:var(--ash);font-size:14px;margin:0;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;}
  .search-toolbar .filters{margin:4px 0 18px;}
  .fchip{font-family:var(--font-mono);font-size:11.5px;letter-spacing:0.04em;text-transform:uppercase;cursor:pointer;padding:7px 14px;border-radius:999px;border:1px solid rgba(237,234,230,0.14);background:rgba(20,18,24,0.6);color:var(--ash);transition:all .15s ease;}
  .fchip:hover{border-color:rgba(255,94,26,0.5);color:var(--bone);}
  .fchip.active{background:linear-gradient(120deg,var(--signal),var(--ember));color:var(--void);border-color:transparent;}

  .players{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media(max-width:820px){.players{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:520px){.players{grid-template-columns:1fr;}}
  .pcard{position:relative;border-radius:18px;overflow:hidden;border:1px solid rgba(237,234,230,0.09);background:linear-gradient(160deg, rgba(38,33,45,0.55), rgba(13,11,16,0.75));transition:transform .25s cubic-bezier(.2,.8,.2,1), border-color .25s ease, box-shadow .25s ease;}
  .pcard:hover{transform:translateY(-5px);border-color:rgba(255,94,26,0.5);box-shadow:0 24px 44px -18px rgba(0,0,0,0.85), 0 0 24px rgba(255,94,26,0.12);}
  .pcard.you{border-color:rgba(255,176,32,0.55);}
  .you-badge{position:absolute;top:12px;right:12px;z-index:3;font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--void);background:var(--ember);border-radius:999px;padding:4px 9px;}

  /* dossier header band (no photo) */
  .pc-head{position:relative;height:104px;overflow:hidden;background:linear-gradient(140deg, rgba(255,94,26,0.16), rgba(33,29,36,0.5) 46%, rgba(13,11,16,0.9));border-bottom:1px solid rgba(255,94,26,0.14);}
  .pc-head .wm{position:absolute;right:-8px;bottom:-30px;font-family:var(--font-display);font-size:120px;line-height:1;color:rgba(237,234,230,0.05);pointer-events:none;user-select:none;}
  .pc-photo{position:absolute;inset:0;background-size:cover;background-position:center 22%;}
  .pc-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,10,13,0) 0%,rgba(11,10,13,0) 42%,rgba(11,10,13,0.32) 63%,rgba(11,10,13,0.8) 83%,#0b0a0d 100%);}
  .pc-head.has-photo{height:236px;background:var(--void);border-bottom:none;}
  .pcard.has-photo{background:#0b0a0d;}
  .pc-rank{position:absolute;top:12px;left:12px;z-index:2;font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:0.05em;color:var(--void);background:linear-gradient(120deg,var(--signal),var(--ember));border-radius:8px;padding:4px 9px;box-shadow:0 6px 16px -6px rgba(255,94,26,0.7);}
  .pc-rank.r-conq{background:linear-gradient(120deg,#ff3b3b,#ffb020);color:#1a0606;box-shadow:0 6px 16px -6px rgba(255,59,59,0.7);}
  .pc-rank.r-ace{background:linear-gradient(120deg,var(--signal),var(--ember));color:var(--void);box-shadow:0 6px 16px -6px rgba(255,94,26,0.7);}
  .pc-rank.r-crown{background:linear-gradient(120deg,#8b5cf6,#c084fc);color:#160a2b;box-shadow:0 6px 16px -6px rgba(139,92,246,0.7);}
  .pc-rank.r-diam{background:linear-gradient(120deg,#22d3ee,#38bdf8);color:#04141a;box-shadow:0 6px 16px -6px rgba(34,211,238,0.6);}
  .pc-rank.r-plat{background:linear-gradient(120deg,#5eead4,#67e8f9);color:#04140f;}
  .pc-rank.r-gold{background:linear-gradient(120deg,#fbbf24,#fde047);color:#1a1400;}
  .pc-rank.r-def{background:var(--gunmetal-2);color:var(--bone);box-shadow:none;}
  .pc-online{position:absolute;top:12px;right:12px;z-index:2;font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.05em;text-transform:uppercase;color:var(--bone);background:rgba(11,10,13,0.55);backdrop-filter:blur(4px);border:1px solid rgba(237,234,230,0.14);border-radius:999px;padding:4px 10px;display:inline-flex;align-items:center;gap:6px;}
  .pc-online::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--intel);box-shadow:0 0 7px 1px rgba(47,224,168,0.8);}
  .pc-online.off::before{background:var(--steel);box-shadow:none;}
  .pc-name{position:absolute;left:16px;bottom:11px;z-index:2;right:14px;}
  .pc-name .n{font-family:var(--font-display);font-size:21px;line-height:1;word-break:break-word;}
  .pc-name .r{font-family:var(--font-mono);font-size:11px;color:var(--ember);text-transform:uppercase;margin-top:5px;}
  .pc-body{padding:14px 16px 16px;}
  .pc-hero{display:flex;align-items:flex-end;gap:14px;padding-bottom:13px;margin-bottom:13px;border-bottom:1px solid rgba(237,234,230,0.08);}
  .pc-kd{font-family:var(--font-display);font-size:34px;line-height:.9;background:linear-gradient(100deg,var(--signal),var(--ember));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .pc-kd small{display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--steel);text-transform:uppercase;-webkit-text-fill-color:var(--steel);margin-bottom:3px;}
  .pc-mini{font-family:var(--font-mono);font-size:12px;color:var(--ash);display:flex;flex-direction:column;gap:3px;}
  .pc-mini b{color:var(--bone);}
  .pc-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .pc-chip{font-family:var(--font-mono);font-size:11px;color:var(--ash);background:rgba(20,18,24,0.7);border:1px solid rgba(237,234,230,0.1);border-radius:999px;padding:5px 11px;}

<div class="bg-topo" data-topo aria-hidden="true"></div>

<script>
/* ---- procedural topographic contour lines (marching squares over value-noise) ---- */
(function(){
  const host = document.querySelector('[data-topo]');
  if(!host) return;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas=document.createElement('canvas');
  canvas.style.cssText='position:absolute;inset:0;width:100%;height:100%;display:block;';
  host.replaceChildren(canvas);
  const ctx=canvas.getContext('2d');
  const DPR=Math.min(window.devicePixelRatio||1,1.5);
  const cell=11, scale=0.0125;
  const levels=[]; for(let t=0.13;t<=0.87;t+=0.062) levels.push(t);
  function makeNoise(seed){
    function rand(x,y){ let n=(x|0)*374761393+(y|0)*668265263+seed*1274126177; n=(n^(n>>13))>>>0; n=(n*1274126177)>>>0; n=(n^(n>>16))>>>0; return n/4294967295; }
    const sm=t=>t*t*(3-2*t), lp=(a,b,t)=>a+(b-a)*t;
    function vn(x,y){ const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=sm(xf),v=sm(yf); return lp(lp(rand(xi,yi),rand(xi+1,yi),u),lp(rand(xi,yi+1),rand(xi+1,yi+1),u),v); }
    return function(x,y){ let a=1,f=1,s=0,nm=0; for(let o=0;o<2;o++){s+=a*vn(x*f,y*f);nm+=a;a*=0.45;f*=2;} return s/nm; };
  }
  const noise=makeNoise(9);
  let W=0,H=0,cols=0,rows=0,field=null,raf=null,ox=0,oy=0,last=0;
  function resize(){
    W=window.innerWidth; H=window.innerHeight; if(!W||!H) return;
    canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    cols=Math.ceil(W/cell)+2; rows=Math.ceil(H/cell)+2;
    field=new Float32Array(cols*rows);
  }
  function render(){
    if(!field) return;
    for(let j=0;j<rows;j++){ const sy=(j*cell+oy)*scale; for(let i=0;i<cols;i++){ field[j*cols+i]=noise((i*cell+ox)*scale,sy); } }
    const at=(i,j)=>field[j*cols+i];
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='#ffb267'; ctx.lineWidth=1.15; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    for(const lv of levels){
      for(let j=0;j<rows-1;j++){
        const y=j*cell;
        for(let i=0;i<cols-1;i++){
          const tl=at(i,j),tr=at(i+1,j),bl=at(i,j+1),br=at(i+1,j+1);
          let c=0; if(tl>lv)c|=8; if(tr>lv)c|=4; if(br>lv)c|=2; if(bl>lv)c|=1;
          if(c===0||c===15) continue;
          const x=i*cell;
          const top=[x+cell*((lv-tl)/(tr-tl)),y];
          const right=[x+cell,y+cell*((lv-tr)/(br-tr))];
          const bottom=[x+cell*((lv-bl)/(br-bl)),y+cell];
          const left=[x,y+cell*((lv-tl)/(bl-tl))];
          const seg=(a,b)=>{ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);};
          switch(c){
            case 1: case 14: seg(left,bottom); break;
            case 2: case 13: seg(bottom,right); break;
            case 3: case 12: seg(left,right); break;
            case 4: case 11: seg(top,right); break;
            case 6: case 9: seg(top,bottom); break;
            case 7: case 8: seg(left,top); break;
            case 5: seg(left,top); seg(bottom,right); break;
            case 10: seg(left,bottom); seg(top,right); break;
          }
        }
      }
    }
    ctx.stroke();
  }
  function loop(ts){ if(!last)last=ts; const dt=Math.min(50,ts-last); last=ts; ox+=dt*0.011; oy+=dt*0.005; render(); raf=requestAnimationFrame(loop); }
  resize(); render();
  if(!reduce){ last=0; raf=requestAnimationFrame(loop); }
  let rt; window.addEventListener('resize', function(){ clearTimeout(rt); rt=setTimeout(function(){ resize(); render(); },200); });
  document.addEventListener('visibilitychange', function(){ if(document.hidden){ if(raf){cancelAnimationFrame(raf);raf=null;} } else if(!reduce&&!raf){ last=0; raf=requestAnimationFrame(loop); } });
})();
</script>

(function(){

    tabs.forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
    Object.keys(panels).forEach(k=>panels[k].classList.toggle('active', k===name));
    if(location.hash.replace('#','')!==name) history.replaceState(null,'','#'+name);
  }
  tabs.forEach(t=>t.addEventListener('click', ()=>selectTab(t.dataset.tab)));
  const initHash = location.hash.replace('#','');
  if(['search','matches','squad'].indexOf(initHash)>=0) selectTab(initHash);

  const panel = panels.profile;

  function renderEmpty(){
    panel.innerHTML =
      '<div class="glass empty-state">'+
        '<div class="es-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7 1.4 0 2.7.3 3.8.9"/><path d="M19 14v6M16 17h6"/></svg></div>'+

        '</div>'+

  function renderEdit(p){

      if(f.type==='select'){
        ctrl = '<select id="f-'+f.key+'">'+f.opts.map(o=>'<option'+(o===p[f.key]?' selected':'')+'>'+o+'</option>').join('')+'</select>';

        ctrl = '<input id="f-'+f.key+'" type="text" value="'+esc(p[f.key]||'')+'" placeholder="'+esc(f.ph||'')+'">';

    {nick:'ShadowReaper', rank:'CONQ ★3', role:'Fragger', gameId:'5473019286', kd:'4.8', kdu:'6.2', device:'Телефон', voice:'Parallel', tg:'@shadow_rpr', age:'22', online:'День', isOnline:false},
    {nick:'nightstalk', rank:'ACE ★4', role:'Sniper', gameId:'5990172634', kd:'3.9', kdu:'4.7', device:'Телефон', voice:'Discord', tg:'@nightstalk', age:'20', online:'Ночь', isOnline:false, likedYou:true},
    {nick:'AceHunter', rank:'CONQ ★7', role:'Fragger', gameId:'5342087611', kd:'6.0', kdu:'7.5', device:'Эмулятор', voice:'Discord', tg:'@acehunter', age:'23', online:'Вечер', isOnline:true}
  ];

  function loadLikes(){ try{ return JSON.parse(localStorage.getItem('sf_likes')) || []; }catch(_){ return []; } }
  function saveLikes(a){ try{ localStorage.setItem('sf_likes', JSON.stringify(a)); }catch(_){} }
  function isLiked(nick){ return loadLikes().indexOf(nick) >= 0; }
  function toggleLike(nick){ const a=loadLikes(); const i=a.indexOf(nick); if(i>=0)a.splice(i,1); else a.push(nick); saveLikes(a); }

  function tgLink(tg){ if(!tg) return null; return 'https://t.me/'+tg.replace(/^@/,''); }
  function heartSvg(){ return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.2C.5 8 2 4.5 5.6 4c2-.3 3.8.7 4.9 2.3C11.6 4.7 13.4 3.7 15.4 4c3.6.5 5.1 4 3.6 7.8-2.5 4.6-10 9.2-10 9.2z"/></svg>'; }
  function closeSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'; }
  function initial(nick){ return esc((nick||'И').charAt(0).toUpperCase()); }
  function rankClass(rank){
    const r = String(rank||'').toLowerCase();
    if(r.indexOf('conq')>=0 || r.indexOf('конк')>=0) return 'r-conq';
    if(r.indexOf('ace')>=0 || r.indexOf('эйс')>=0) return 'r-ace';
    if(r.indexOf('crown')>=0 || r.indexOf('коро')>=0) return 'r-crown';
    if(r.indexOf('diam')>=0 || r.indexOf('алмаз')>=0) return 'r-diam';
    if(r.indexOf('plat')>=0 || r.indexOf('плат')>=0) return 'r-plat';
    if(r.indexOf('gold')>=0 || r.indexOf('золо')>=0) return 'r-gold';
    return 'r-def';
  }
  function downscaleImage(file, max, cb){
    const reader = new FileReader();
    reader.onload = function(){
      const img = new Image();
      img.onload = function(){
        let w = img.width, h = img.height;
        const scale = Math.min(1, max/Math.max(w,h));
        w = Math.round(w*scale); h = Math.round(h*scale);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        try{ cb(c.toDataURL('image/jpeg',0.82)); }catch(_){ cb(null); }
      };
      img.onerror = function(){ cb(null); };
      img.src = reader.result;
    };
    reader.onerror = function(){ cb(null); };
    reader.readAsDataURL(file);
  }
  function photoStyle(url){ return url ? ' style="background-image:url(\''+url+'\')"' : ''; }
  function bookmarkSvg(){ return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>'; }
  function copySvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>'; }

  /* squad (favorites) persistence, max 4 */
  const SQUAD_MAX = 4;
  function loadSquad(){ try{ return JSON.parse(localStorage.getItem('sf_squad')) || []; }catch(_){ return []; } }
  function saveSquad(a){ try{ localStorage.setItem('sf_squad', JSON.stringify(a)); }catch(_){} }
  function inSquad(nick){ return loadSquad().indexOf(nick) >= 0; }
  function toggleSquad(nick){ const a=loadSquad(); const i=a.indexOf(nick); if(i>=0){ a.splice(i,1); saveSquad(a); return 'removed'; } if(a.length>=SQUAD_MAX) return 'full'; a.push(nick); saveSquad(a); return 'added'; }

  /* rank tiers + compatibility */
  function rankTier(rank){ return {'r-conq':'Conqueror','r-ace':'Ace','r-crown':'Crown','r-diam':'Diamond','r-plat':'Platinum','r-gold':'Gold','r-def':'Другой'}[rankClass(rank)] || 'Другой'; }
  function rankWeight(rank){ return {'r-conq':7,'r-ace':6,'r-crown':5,'r-diam':4,'r-plat':3,'r-gold':2,'r-def':1}[rankClass(rank)] || 0; }
  function num(x){ const n=parseFloat(String(x==null?'':x).replace(',','.')); return isNaN(n)?null:n; }
  function compatScore(me, p){
    if(!me) return null;
    let s = 0;
    if(me.voice && p.voice) s += (me.voice===p.voice) ? 25 : 5;
    if(me.online && p.online) s += (me.online===p.online) ? 20 : 8;
    if(me.role && p.role) s += (me.role!==p.role) ? 25 : 12;   // разные роли = синергия отряда
    if(me.device && p.device) s += (me.device===p.device) ? 10 : 4;
    const a=num(me.kd), b=num(p.kd);
    s += (a!=null && b!=null) ? Math.round(20*(1-Math.min(1,Math.abs(a-b)/3))) : 8;
    return Math.max(5, Math.min(100, Math.round(s)));
  }
  function compatCls(score){ return score>=75 ? 'c-hi' : (score>=50 ? 'c-mid' : 'c-lo'); }

  function tgBtnHTML(tg){
    const link = tgLink(tg);
    return link
      ? '<a class="btn tg-btn" href="'+link+'" target="_blank" rel="noopener" data-stop><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.5L18.5 20c-.25 1.1-.92 1.37-1.86.85l-5.14-3.79-2.48 2.39c-.27.27-.5.5-1.03.5l.37-5.23L17.9 6.2c.42-.37-.09-.58-.65-.21L6.14 12.9l-5.06-1.58c-1.1-.34-1.12-1.1.23-1.63L20.5 2.9c.92-.34 1.72.21 1.4 1.6z"/></svg> Написать в Telegram</a>'
      : '<span class="btn tg-btn disabled">Telegram не указан</span>';
  }
  function compatBadgeHTML(p){
    const mine = loadProfile();
    if(p.you || !mine) return '';
    const sc = compatScore(mine, p);
    return '<div class="compat '+compatCls(sc)+'"><svg viewBox="0 0 24 24" fill="currentColor" width="13" height="13"><path d="M12 2l2.4 5.9L20.5 8l-4.6 4 1.4 6.2L12 15.9 6.7 18.2 8.1 12 3.5 8l6.1-.1z"/></svg><span>Совместимость</span> <span class="cnum">'+sc+'%</span></div>';
  }
  function playerCardHTML(p, mode){
    const liked = isLiked(p.nick), saved = inSquad(p.nick);
    const rankBadge = p.rank ? '<span class="pc-rank '+rankClass(p.rank)+'">'+esc(p.rank)+'</span>' : '';
    const photoLayer = p.photo ? '<span class="pc-photo"'+photoStyle(p.photo)+'></span>' : '<span class="wm">'+initial(p.nick)+'</span>';
    const topRight = p.you
      ? '<span class="you-badge">Это вы</span>'
      : '<span class="pc-online'+(p.isOnline===false?' off':'')+'">'+esc(p.online||'—')+'</span>';
    const heart = p.you ? '' : '<button class="like-heart'+(liked?' liked':'')+'" data-like="'+esc(p.nick)+'" data-stop aria-label="Лайкнуть анкету">'+heartSvg()+'</button>';
    const save = p.you ? '' : '<button class="save-btn'+(saved?' saved':'')+'" data-save="'+esc(p.nick)+'" data-stop aria-label="В отряд">'+bookmarkSvg()+'</button>';
    let bodyTop = '', actions = '';
    if(mode==='match'){
      bodyTop = liked
        ? '<div class="match-badge">'+heartSvg()+' Взаимный мэтч</div>'
        : '<div class="match-badge pending">'+heartSvg()+' Лайкнул твою анкету</div>';
      const likeBack = liked ? '' : '<button class="btn like-back-btn" data-like="'+esc(p.nick)+'" data-stop>'+heartSvg()+' Лайкнуть в ответ</button>';
      actions = likeBack+'<div class="pc-acts">'+save+tgBtnHTML(p.tg)+'</div>';
    } else if(mode==='squad'){
      bodyTop = compatBadgeHTML(p);
      actions = '<button class="btn like-back-btn" data-squad-remove="'+esc(p.nick)+'" data-stop>'+closeSvg()+' Убрать из отряда</button><div class="pc-acts">'+tgBtnHTML(p.tg)+'</div>';
    } else {
      bodyTop = compatBadgeHTML(p);
      actions = '<div class="pc-acts">'+heart+save+tgBtnHTML(p.tg)+'</div>';
    }
    return '<div class="pcard'+(p.you?' you':'')+(p.photo?' has-photo':'')+'" data-open="'+esc(p.nick)+'">'+
      '<div class="pc-head'+(p.photo?' has-photo':'')+'">'+
        photoLayer+
        rankBadge+ topRight+
        '<div class="pc-name"><div class="n">'+esc(p.nick||'Игрок')+'</div><div class="r">'+esc(p.role||'—')+'</div></div>'+
      '</div>'+
      '<div class="pc-body">'+
        bodyTop+
        '<div class="pc-hero"><div class="pc-kd"><small>K/D</small>'+esc(p.kd||'—')+'</div><div class="pc-mini"><span>K/D Ult <b>'+esc(p.kdu||'—')+'</b></span><span>Возраст <b>'+esc(p.age||'—')+'</b></span></div></div>'+
        '<div class="pc-tags"><span class="pc-chip">'+esc(p.device||'—')+'</span><span class="pc-chip">'+esc(p.voice||'—')+'</span></div>'+
        actions+
      '</div>'+
    '</div>';
  }

  function findPlayer(nick){
    const mine = loadProfile();
    if(mine && (mine.nick||'Игрок')===nick) return Object.assign({you:true, online:'Сейчас'}, mine);
    return MOCK.filter(x=>x.nick===nick)[0] || null;
  }

  /* full-info modal */
  const DETAIL = [
    ['Ранг','rank'],['Роль','role'],['Игровой ID','gameId'],['K/D','kd'],['K/D Ultimate','kdu'],
    ['Устройство','device'],['Приложение для связи','voice'],['Telegram','tg'],['Возраст','age'],['Онлайн','online']
  ];
  const modal = document.getElementById('pmodal');
  const modalCard = document.getElementById('pmodalCard');
  function openModal(p){
    const liked = isLiked(p.nick), saved = inSquad(p.nick);
    const rows = DETAIL.map(function(f){
      const v = p[f[1]];
      return '<div class="drow"><span class="k">'+f[0]+'</span>'+(v?'<span class="v">'+esc(v)+'</span>':'<span class="v empty">не указано</span>')+'</div>';
    }).join('');
    const compat = compatBadgeHTML(p);
    const likeBtn = p.you ? '' : '<button class="btn '+(liked?'btn-primary':'btn-ghost')+'" id="pmLike">'+heartSvg()+' '+(liked?'Вы лайкнули':'Лайкнуть анкету')+'</button>';
    const saveBtn = p.you ? '' : '<button class="btn '+(saved?'btn-primary':'btn-ghost')+'" id="pmSave">'+bookmarkSvg()+' '+(saved?'В отряде':'Добавить в отряд')+'</button>';
    const copyBtn = p.gameId ? '<button class="btn btn-ghost" id="pmCopy">'+copySvg()+' Копировать ID</button>' : '';
    modalCard.innerHTML =
      '<button class="pm-close" id="pmClose" aria-label="Закрыть">'+closeSvg()+'</button>'+
      '<div class="pm-head">'+(p.photo?'<div class="pm-av has-photo"'+photoStyle(p.photo)+'></div>':'<div class="pm-av">'+initial(p.nick)+'</div>')+'<div><div class="pm-nm">'+esc(p.nick||'Игрок')+'</div><span class="pm-rl">Role: '+esc(p.role||'—')+'</span></div></div>'+
      (compat?'<div style="padding:14px 26px 0">'+compat+'</div>':'')+
      '<div class="grid2">'+rows+'</div>'+
      '<div class="pm-actions">'+likeBtn+saveBtn+copyBtn+tgBtnHTML(p.tg)+'</div>';
    modal.classList.add('open'); modal.setAttribute('aria-hidden','false');
    document.getElementById('pmClose').addEventListener('click', closeModal);
    const lb = document.getElementById('pmLike');
    if(lb) lb.addEventListener('click', function(){ toggleLike(p.nick); refreshAll(); openModal(findPlayer(p.nick)); });
    const sb = document.getElementById('pmSave');
    if(sb) sb.addEventListener('click', function(){ const r=toggleSquad(p.nick); if(r==='full'){ sb.textContent=' Отряд заполнен (макс. '+SQUAD_MAX+')'; return; } refreshAll(); openModal(findPlayer(p.nick)); });
    const cb = document.getElementById('pmCopy');
    if(cb) cb.addEventListener('click', function(){ copyText(p.gameId, cb); });
  }
  function copyText(text, btn){
    const done = function(){ if(btn){ const o=btn.innerHTML; btn.innerHTML = copySvg()+' Скопировано!'; setTimeout(function(){ btn.innerHTML=o; },1400); } };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(String(text)).then(done, done); }
    else { try{ const t=document.createElement('textarea'); t.value=String(text); document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t); }catch(_){ } done(); }
  }
  function closeModal(){ modal.classList.remove('open'); modal.setAttribute('aria-hidden','true'); }
  modal.addEventListener('click', function(e){ if(e.target===modal) closeModal(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && modal.classList.contains('open')) closeModal(); });

  function bindGrid(grid){
    grid.querySelectorAll('.pcard').forEach(function(card){
      card.addEventListener('click', function(e){
        if(e.target.closest('[data-stop]')) return;
        const p = findPlayer(card.getAttribute('data-open'));
        if(p) openModal(p);
      });
    });
    grid.querySelectorAll('[data-like]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.preventDefault(); e.stopPropagation();
        toggleLike(btn.getAttribute('data-like'));
        refreshAll();
      });
    });
    grid.querySelectorAll('[data-save]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.preventDefault(); e.stopPropagation();
        const r = toggleSquad(btn.getAttribute('data-save'));
        if(r==='full'){ btn.classList.add('shake'); setTimeout(function(){ btn.classList.remove('shake'); },400); flashSquadFull(); return; }
        refreshAll();
      });
    });
    grid.querySelectorAll('[data-squad-remove]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.preventDefault(); e.stopPropagation();
        toggleSquad(btn.getAttribute('data-squad-remove'));
        refreshAll();
      });
    });
  }
  function flashSquadFull(){
    const el = document.getElementById('resultCount');
    if(!el) return; const o = el.innerHTML;
    el.innerHTML = '<span style="color:var(--ember)">Отряд заполнен — максимум '+SQUAD_MAX+' игрока.</span>';
    setTimeout(function(){ el.innerHTML = o; }, 2200);
  }

  /* ---- filters state (persisted) ---- */
  const filterState = (function(){
    let s = {}; try{ s = JSON.parse(localStorage.getItem('sf_search')) || {}; }catch(_){ s = {}; }
    return Object.assign({ q:'', role:'Все', rank:'Все', device:'Все', voice:'Все', online:false, sort:'' }, s);
  })();
  function saveFilterState(){ try{ localStorage.setItem('sf_search', JSON.stringify(filterState)); }catch(_){} }
  const uniq = arr => arr.filter((v,i)=>arr.indexOf(v)===i);

  const searchInput = document.getElementById('searchInput');
  const sortSelect = document.getElementById('sortSelect');
  const fRank = document.getElementById('fRank'), fDevice = document.getElementById('fDevice'), fVoice = document.getElementById('fVoice');
  const fOnline = document.getElementById('fOnline'), fReset = document.getElementById('fReset');
  const filtersEl = document.getElementById('filters');

  function optionsHTML(all, values, current){
    return [all].concat(values).map(v=>'<option value="'+esc(v)+'"'+(v===current?' selected':'')+'>'+esc(v===all?all:v)+'</option>').join('');
  }
  function populateControls(){
    filtersEl.innerHTML = ROLES.map(r=>'<button class="fchip'+(r===filterState.role?' active':'')+'" data-role="'+r+'" type="button">'+r+'</button>').join('');
    fRank.innerHTML   = optionsHTML('Все', uniq(MOCK.map(p=>rankTier(p.rank))), filterState.rank).replace('>Все<','>Ранг: все<');
    fDevice.innerHTML = optionsHTML('Все', uniq(MOCK.map(p=>p.device)), filterState.device).replace('>Все<','>Устройство: все<');
    fVoice.innerHTML  = optionsHTML('Все', uniq(MOCK.map(p=>p.voice)), filterState.voice).replace('>Все<','>Связь: все<');
    const hasProfile = !!loadProfile();
    const sorts = [['relevance','По умолчанию']].concat(hasProfile?[['compat','По совместимости']]:[]).concat([['kd_desc','K/D: сначала высокий'],['kd_asc','K/D: сначала низкий'],['rank','По рангу'],['age_asc','По возрасту']]);
    if(!filterState.sort) filterState.sort = hasProfile ? 'compat' : 'relevance';
    sortSelect.innerHTML = sorts.map(s=>'<option value="'+s[0]+'"'+(s[0]===filterState.sort?' selected':'')+'>'+s[1]+'</option>').join('');
    fOnline.classList.toggle('active', !!filterState.online);
    searchInput.value = filterState.q || '';
  }

  function applyFilters(){
    const mine = loadProfile();
    let list = MOCK.slice();
    if(mine) list.unshift(Object.assign({you:true, online:'Сейчас', isOnline:true}, mine));
    const q = (filterState.q||'').trim().toLowerCase();
    if(q) list = list.filter(p=>String(p.nick||'').toLowerCase().indexOf(q)>=0);
    if(filterState.role!=='Все') list = list.filter(p=>p.role===filterState.role);
    if(filterState.rank!=='Все') list = list.filter(p=>rankTier(p.rank)===filterState.rank);
    if(filterState.device!=='Все') list = list.filter(p=>p.device===filterState.device);
    if(filterState.voice!=='Все') list = list.filter(p=>p.voice===filterState.voice);
    if(filterState.online) list = list.filter(p=>p.you || p.isOnline);

    const s = filterState.sort;
    list.sort((a,b)=>{
      if(a.you) return -1; if(b.you) return 1;   // your card always first
      if(s==='compat'){ return (compatScore(mine,b)||0)-(compatScore(mine,a)||0); }
      if(s==='kd_desc'){ return (num(b.kd)||0)-(num(a.kd)||0); }
      if(s==='kd_asc'){ return (num(a.kd)||0)-(num(b.kd)||0); }
      if(s==='rank'){ return rankWeight(b.rank)-rankWeight(a.rank); }
      if(s==='age_asc'){ return (num(a.age)||0)-(num(b.age)||0); }
      return 0;
    });

    const grid = document.getElementById('players');
    const countEl = document.getElementById('resultCount');
    const shown = list.filter(p=>!p.you).length;
    if(countEl) countEl.innerHTML = 'Найдено <b>'+shown+'</b> '+plural(shown,'игрок','игрока','игроков');
    if(!list.length){ grid.innerHTML = '<p style="color:var(--ash)">Никого не нашлось. Ослабь фильтры или сбрось их.</p>'; return; }
    grid.innerHTML = list.map(p=>playerCardHTML(p,'search')).join('');
    bindGrid(grid);
  }
  function plural(n,one,few,many){ const m=n%100, d=n%10; if(m>=11&&m<=14)return many; if(d===1)return one; if(d>=2&&d<=4)return few; return many; }
  function renderPlayers(){ populateControls(); applyFilters(); }

  filtersEl.addEventListener('click', function(e){
    const b = e.target.closest('.fchip'); if(!b) return;
    filterState.role = b.dataset.role; saveFilterState();
    filtersEl.querySelectorAll('.fchip').forEach(x=>x.classList.toggle('active', x===b));
    applyFilters();
  });
  searchInput.addEventListener('input', function(){ filterState.q=searchInput.value; saveFilterState(); applyFilters(); });
  sortSelect.addEventListener('change', function(){ filterState.sort=sortSelect.value; saveFilterState(); applyFilters(); });
  fRank.addEventListener('change', function(){ filterState.rank=fRank.value; saveFilterState(); applyFilters(); });
  fDevice.addEventListener('change', function(){ filterState.device=fDevice.value; saveFilterState(); applyFilters(); });
  fVoice.addEventListener('change', function(){ filterState.voice=fVoice.value; saveFilterState(); applyFilters(); });
  fOnline.addEventListener('click', function(){ filterState.online=!filterState.online; fOnline.classList.toggle('active',filterState.online); saveFilterState(); applyFilters(); });
  fReset.addEventListener('click', function(){ Object.assign(filterState,{q:'',role:'Все',rank:'Все',device:'Все',voice:'Все',online:false}); saveFilterState(); populateControls(); applyFilters(); });

  /* ---- squad (favorites) ---- */
  function squadMembers(){ const set = loadSquad(); return set.map(findPlayer).filter(Boolean); }
  function renderSquad(){
    const cover = document.getElementById('squadCover');
    const grid = document.getElementById('squad');
    const members = squadMembers();
    const rolesNeeded = ['IGL','Fragger','Support','Sniper'];
    const covered = {}; members.forEach(m=>{ if(m.role) covered[m.role]=m.nick; });
    const slots = rolesNeeded.map(r=>'<div class="role-slot'+(covered[r]?' filled':'')+'"><div class="rs-role">'+r+'</div><div class="rs-nick">'+(covered[r]?esc(covered[r]):'—')+'</div></div>').join('');
    const missing = rolesNeeded.filter(r=>!covered[r]);
    const hint = members.length>=SQUAD_MAX
      ? '<div class="sc-hint full">Отряд собран — 4 из 4. Готовы к дропу!</div>'
      : (missing.length ? '<div class="sc-hint">Не хватает ролей: '+missing.join(', ')+'</div>' : '');
    cover.innerHTML =
      '<div class="sc-top"><div class="sc-title">Мой отряд</div><div class="sc-count"><b>'+members.length+'</b> / '+SQUAD_MAX+'</div></div>'+
      '<div class="role-slots">'+slots+'</div>'+ hint;
    if(!members.length){
      grid.innerHTML = '<div class="glass empty-state" style="grid-column:1/-1"><div class="es-ico">'+bookmarkSvg()+'</div><h3>Отряд пуст</h3><p>Добавляй игроков кнопкой «В отряд» на карточке или в анкете. Максимум '+SQUAD_MAX+'.</p></div>';
      return;
    }
    grid.innerHTML = members.map(p=>playerCardHTML(p,'squad')).join('');
    bindGrid(grid);
  }
  function updateSquadCount(){
    const el = document.getElementById('squadCount');
    const n = loadSquad().length;
    if(n>0){ el.textContent = n; el.style.display=''; } else { el.style.display='none'; }
  }

  function incomingLikes(){ return loadProfile() ? MOCK.filter(p=>p.likedYou) : []; }
  function emptyMatchesHTML(msg){
    return '<div class="glass empty-state" style="grid-column:1/-1">'+
      '<div class="es-ico">'+heartSvg()+'</div>'+
      '<h3>Мэтчей пока нет</h3><p>'+esc(msg)+'</p>'+
      (loadProfile()?'':'<a class="btn btn-primary" href="index.html#search">Создать профиль →</a>')+
    '</div>';
  }
  function renderMatches(){
    const grid = document.getElementById('matches');
    if(!loadProfile()){ grid.innerHTML = emptyMatchesHTML('Создай профиль, чтобы игроки могли находить и лайкать твою анкету.'); return; }
    const list = incomingLikes();
    if(!list.length){ grid.innerHTML = emptyMatchesHTML('Пока никто не лайкнул твою анкету. Загляни позже или сам полайкай игроков в поиске.'); return; }
    grid.innerHTML = list.map(p=>playerCardHTML(p,'match')).join('');
    bindGrid(grid);
  }
  function updateMatchCount(){
    const el = document.getElementById('matchCount');
    const n = incomingLikes().length;
    if(n>0){ el.textContent = n; el.style.display=''; } else { el.style.display='none'; }
  }

  function refreshAll(){ renderPlayers(); renderMatches(); renderSquad(); updateMatchCount(); updateSquadCount(); }
  refreshAll();
})();

/* embers */
(function(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('canvas[data-embers]').forEach(function(canvas){
    const ctx=canvas.getContext('2d');let w,h,particles=[],raf=null;const DPR=Math.min(window.devicePixelRatio||1,2);
    function resize(){const r=canvas.getBoundingClientRect();w=r.width;h=r.height;canvas.width=w*DPR;canvas.height=h*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);const c=Math.round(Math.min(90,Math.max(36,w*h/16000)));particles=Array.from({length:c},makeP);}
    function makeP(){return {x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.8+0.4,vy:-(Math.random()*0.5+0.15),vx:(Math.random()-0.5)*0.4,life:Math.random(),flick:Math.random()*0.04+0.01,hue:Math.random()>0.5?28:18};}
    function tick(){ctx.clearRect(0,0,w,h);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.life+=p.flick;p.vx+=(Math.random()-0.5)*0.02;if(p.y<-6||p.x<-6||p.x>w+6){Object.assign(p,makeP(),{y:h+6,x:Math.random()*w});}const a=0.35+Math.abs(Math.sin(p.life))*0.55;const gr=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3.2);gr.addColorStop(0,'hsla('+p.hue+',100%,62%,'+a+')');gr.addColorStop(1,'hsla('+p.hue+',100%,50%,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(p.x,p.y,p.r*3.2,0,Math.PI*2);ctx.fill();ctx.fillStyle='hsla('+p.hue+',100%,80%,'+a+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r*0.7,0,Math.PI*2);ctx.fill();}raf=requestAnimationFrame(tick);}
    let rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(resize,150);});resize();tick();
  });
})();
</script>
</body>
</html>
