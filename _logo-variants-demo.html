<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Варианты логотипа</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--void:#0b0a0d;--gun:#17151a;--steel:#4a454e;--bone:#edeae6;--ash:#a89fa8;
    --signal:#ff5e1a;--ember:#ffb020;--intel:#2fe0a8;
    --fd:'Oswald',sans-serif;--fm:'JetBrains Mono',monospace;--fb:'Inter',sans-serif;}
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(1100px 600px at 30% -10%,#1c1420,#0b0a0d 55%);color:var(--bone);font-family:var(--fb);padding:40px 24px 90px;}
  .wrap{max-width:940px;margin:0 auto;}
  h1{font-family:var(--fd);font-size:25px;margin:0 0 6px;}
  .lead{color:var(--ash);font-size:14px;margin:0 0 32px;}
  .row{margin-bottom:18px;border:1px solid rgba(237,234,230,.1);border-radius:16px;background:rgba(20,18,24,.4);overflow:hidden;}
  .rh{display:flex;align-items:center;gap:10px;padding:12px 18px 6px;}
  .rh .n{font-family:var(--fm);font-size:12px;font-weight:700;color:var(--void);background:var(--ember);border-radius:6px;padding:2px 8px;}
  .rh h2{font-family:var(--fd);font-size:16px;margin:0;}
  .rd{color:var(--ash);font-size:12px;padding:0 18px 12px;}
  /* nav mock */
  .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:linear-gradient(180deg,#141017,#0d0b11);border-top:1px solid rgba(237,234,230,.06);}
  .nav .right{display:flex;gap:10px;align-items:center;}
  .chip{font-family:var(--fm);font-size:10px;color:var(--ash);border:1px solid rgba(237,234,230,.14);border-radius:20px;padding:6px 12px;}
  /* big showcase */
  .big{display:flex;align-items:center;justify-content:center;gap:22px;padding:26px;flex-wrap:wrap;background:radial-gradient(400px 200px at 50% 0,rgba(255,94,26,.06),transparent 60%);}
  .big .brand{transform:scale(1.7);transform-origin:center;}

  .brand{display:inline-flex;align-items:center;gap:11px;text-decoration:none;}
  .brand-mark{width:36px;height:36px;flex:none;display:block;}
  .bw{font-family:var(--fd);font-size:20px;letter-spacing:.01em;color:var(--bone);display:flex;align-items:center;gap:7px;line-height:1;}
  .bw .grad{background:linear-gradient(100deg,var(--signal),var(--ember));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .bw .pill{font-family:var(--fm);font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--signal);border:1px solid var(--signal);border-radius:999px;padding:3px 8px;}
  .bw.stack{flex-direction:column;align-items:flex-start;gap:0;font-size:17px;}
  .bw.stack .sub{font-family:var(--fm);font-size:9px;letter-spacing:.34em;color:var(--ash);}
  .glow{filter:drop-shadow(0 0 6px rgba(255,94,26,.4));}
</style>
</head>
<body>
<div class="wrap">
  <h1>Логотип Skill Forge — 6 вариантов</h1>
  <p class="lead">Каждый показан в шапке и крупно. Скажи номер (можно смешать: «значок из 3 + текст из 1»).</p>
  <div id="root"></div>
</div>
<script>
/* ---- marks ---- */
function grad(id){return '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5e1a"/><stop offset="1" stop-color="#ffb020"/></linearGradient></defs>';}
var MARKS={
  // 1 ember crosshair (refined current)
  crosshair:'<svg class="brand-mark glow" viewBox="0 0 40 40" fill="none">'+grad('m1')+
    '<circle cx="20" cy="20" r="14" stroke="url(#m1)" stroke-width="2.6"/>'+
    '<path d="M20 1v6M20 33v6M1 20h6M33 20h6" stroke="url(#m1)" stroke-width="2.6" stroke-linecap="round"/>'+
    '<circle cx="20" cy="20" r="4.6" fill="url(#m1)"/></svg>',
  // 2 hex badge + crosshair
  hex:'<svg class="brand-mark glow" viewBox="0 0 40 40" fill="none">'+grad('m2')+
    '<path d="M20 3 L34.5 11.5 V28.5 L20 37 L5.5 28.5 V11.5 Z" stroke="url(#m2)" stroke-width="2.3"/>'+
    '<circle cx="20" cy="20" r="6" stroke="url(#m2)" stroke-width="2"/>'+
    '<path d="M20 9v4M20 27v4M9 20h4M27 20h4" stroke="url(#m2)" stroke-width="2" stroke-linecap="round"/>'+
    '<circle cx="20" cy="20" r="2" fill="url(#m2)"/></svg>',
  // 3 spark / star
  spark:'<svg class="brand-mark glow" viewBox="0 0 40 40" fill="none">'+grad('m3')+
    '<path d="M20 3 C21.5 15, 25 18.5, 37 20 C25 21.5, 21.5 25, 20 37 C18.5 25, 15 21.5, 3 20 C15 18.5, 18.5 15, 20 3 Z" fill="url(#m3)"/>'+
    '<circle cx="20" cy="20" r="2.4" fill="#fff"/></svg>',
  // 4 flame (forge fire)
  flame:'<svg class="brand-mark glow" viewBox="0 0 24 24" fill="none">'+
    '<defs><linearGradient id="m4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd35a"/><stop offset=".5" stop-color="#ffb020"/><stop offset="1" stop-color="#ff3d1a"/></linearGradient></defs>'+
    '<path d="M12 2c1.4 3.2 4.6 5.2 4.6 9.1 0 1.3-.5 2.4-1.3 3.2.4-1.6-.4-3.2-1.8-4 .5 2.4-.8 3.6-1.6 4.7-.7 1-.6 2.2.1 3-1.9-.3-3.6-1.8-3.6-4 0-1.4.7-2.4 1.4-3.4-2.1.6-3.3 2.3-3.3 4.6a6 6 0 1 0 12 0C18 6 14 4.6 12 2z" fill="url(#m4)"/></svg>',
  // 5 shield + target
  shield:'<svg class="brand-mark glow" viewBox="0 0 40 40" fill="none">'+grad('m5')+
    '<path d="M20 3 L33 8 V19 C33 28, 27.5 33.5, 20 37 C12.5 33.5, 7 28, 7 19 V8 Z" stroke="url(#m5)" stroke-width="2.3"/>'+
    '<circle cx="20" cy="19" r="5.4" stroke="url(#m5)" stroke-width="1.9"/>'+
    '<circle cx="20" cy="19" r="1.8" fill="url(#m5)"/></svg>',
  // 6 SF monogram badge
  mono:'<svg class="brand-mark" viewBox="0 0 40 40" fill="none">'+grad('m6')+
    '<rect x="3" y="3" width="34" height="34" rx="11" fill="url(#m6)"/>'+
    '<path d="M24.5 13.5c-1.2-1-3-1.4-4.6-1.4-2.6 0-4.4 1.3-4.4 3.3 0 4.4 8.2 2.4 8.2 6.9 0 2.2-2 3.6-4.8 3.6-1.8 0-3.6-.6-4.8-1.7" stroke="#160a03" stroke-width="2.4" stroke-linecap="round" fill="none"/>'+
    '</svg>'
};
/* ---- wordmarks ---- */
var WM={
  pill:'<span class="bw">SKILL <span class="pill">FORGE</span></span>',
  grad:'<span class="bw">SKILL <span class="grad">FORGE</span></span>',
  stack:'<span class="bw stack"><span>SKILL <span class="grad">FORGE</span></span><span class="sub">PUBG MOBILE COMMUNITY</span></span>',
  gradAll:'<span class="bw"><span class="grad">SKILL&nbsp;FORGE</span></span>'
};
var VARIANTS=[
  {n:'1',t:'Ember Crosshair (обновлённый прицел)',d:'Текущий прицел, но с градиентной обводкой, вынесенными тактическими рисками и свечением. Знакомо, но заметно чище.',mark:'crosshair',wm:'grad'},
  {n:'2',t:'Hex Badge (гексагон-бейдж)',d:'Прицел внутри гексагона с градиентной рамкой — киберспортивный «значок команды». Солидно и премиально.',mark:'hex',wm:'pill'},
  {n:'3',t:'Forge Spark (искра-звезда)',d:'Динамичная искра-звезда с бликом — символ «искры из кузницы». Яркий, современный, запоминается.',mark:'spark',wm:'grad'},
  {n:'4',t:'Flame (пламя кузницы)',d:'Стилизованное пламя — прямая отсылка к «Forge» (кузница). Тёплый, живой, отличается от прицела.',mark:'flame',wm:'stack'},
  {n:'5',t:'Shield Target (щит + прицел)',d:'Прицел внутри щита — «безопасный подбор + меткость». Тактично и в тему PUBG.',mark:'shield',wm:'grad'},
  {n:'6',t:'SF Monogram (монограмма)',d:'Оранжевый бейдж-плашка с монограммой «S/F». Минималистично, как у крупных брендов; хорошо смотрится маленьким (иконка, фавиконка).',mark:'mono',wm:'gradAll'}
];
var root=document.getElementById('root');
root.innerHTML=VARIANTS.map(function(v){
  var brand='<a class="brand">'+MARKS[v.mark]+WM[v.wm]+'</a>';
  return '<div class="row"><div class="rh"><span class="n">'+v.n+'</span><h2>'+v.t+'</h2></div><div class="rd">'+v.d+'</div>'+
    '<div class="nav">'+brand+'<span class="right"><span class="chip">Войти / Регистрация</span></span></div>'+
    '<div class="big">'+brand+'</div></div>';
}).join('');
</script>
</body>
</html>
