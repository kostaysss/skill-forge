<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Skill Forge — Личный кабинет</title>
<style>
  :root{
    --void:#0b0a0d; --gunmetal:#17151a; --gunmetal-2:#211d24; --steel:#4a454e;
    --bone:#edeae6; --ash:#a89fa8; --signal:#ff5e1a; --ember:#ffb020; --intel:#2fe0a8;
    --grid-line: rgba(237,234,230,0.05);
    --font-display: "Arial Black","Haettenschweiler","Franklin Gothic Bold","Segoe UI",sans-serif;
    --font-body: -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-mono: "SF Mono","Cascadia Code","Consolas","Roboto Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:radial-gradient(150% 120% at 50% 38%, #100c13 42%, #08070b 100%), var(--void);background-attachment:fixed;color:var(--bone);font-family:var(--font-body);line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  ::selection{background:var(--signal);color:var(--void);}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ember);outline-offset:2px;}

  .bg-topo{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:0.22;}
  .bg-topo svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .ember-global{position:fixed;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none;}

  .wrap{max-width:1080px;margin:0 auto;padding:0 clamp(20px,4vw,40px);}

  .btn{font-family:var(--font-mono);font-size:12.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;text-decoration:none;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:9px;padding:12px 22px;border-radius:999px;transition:transform .15s ease, filter .15s ease, border-color .15s ease, background .15s ease;}
  .btn:hover{transform:translateY(-2px);}
  .btn-primary{background:linear-gradient(100deg,var(--signal),var(--ember));color:var(--void);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:var(--gunmetal-2);color:var(--bone);border:1px solid var(--steel);}
  .btn-ghost:hover{border-color:var(--signal);color:var(--bone);}

  .nav{position:sticky;top:0;z-index:200;background:rgba(11,10,13,0.86);backdrop-filter:blur(10px);border-bottom:1px solid rgba(237,234,230,0.08);}
  .nav .wrap{display:flex;align-items:center;justify-content:space-between;height:72px;max-width:1180px;}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
  .brand svg{width:32px;height:32px;}
  .brand-word{font-family:var(--font-display);font-size:18px;color:var(--bone);display:flex;align-items:center;gap:6px;}
  .brand-word .tag{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:0.1em;color:var(--signal);border:1px solid var(--signal);border-radius:999px;padding:3px 8px;}

  main{padding:38px 0 90px;position:relative;z-index:1;}
  .page-title{font-family:var(--font-display);font-size:clamp(24px,3.4vw,36px);text-transform:uppercase;margin:0 0 22px;}
  .page-title .accent{background:linear-gradient(100deg,var(--signal),var(--ember));-webkit-background-clip:text;background-clip:text;color:transparent;}

  /* tabs */
  .tabs{display:flex;gap:12px;margin-bottom:26px;flex-wrap:wrap;}
  .tab{
    font-family:var(--font-mono);font-size:13px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;
    display:inline-flex;align-items:center;gap:9px;cursor:pointer;
    padding:12px 22px;border-radius:12px;border:1px solid rgba(237,234,230,0.1);
    background:linear-gradient(160deg, rgba(33,29,36,0.6), rgba(17,15,19,0.85));color:var(--ash);
    transition:transform .18s ease, border-color .18s ease, color .18s ease, background .18s ease;
  }
  .tab svg{width:17px;height:17px;}
  .tab:hover{transform:translateY(-2px);color:var(--bone);border-color:rgba(255,94,26,0.4);}
  .tab.active{background:linear-gradient(120deg,var(--signal),var(--ember));color:var(--void);border-color:transparent;box-shadow:0 12px 26px -12px rgba(255,94,26,0.6);}
  .tabpanel{display:none;animation:fadeIn .35s ease;}
  .tabpanel.active{display:block;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  .glass{background:linear-gradient(160deg, rgba(40,35,46,0.42), rgba(14,12,18,0.6));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.12);border-radius:20px;box-shadow:0 26px 60px -25px rgba(0,0,0,0.85), inset 0 1px 0 rgba(255,255,255,0.14);}

  /* profile card */
  .profile-top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:24px 26px;border-bottom:1px solid rgba(237,234,230,0.08);flex-wrap:wrap;}
  .who{display:flex;align-items:center;gap:16px;}
  .avatar{width:64px;height:64px;border-radius:16px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:26px;color:var(--void);background:linear-gradient(135deg,var(--signal),var(--ember));box-shadow:0 0 22px rgba(255,94,26,0.3);}
  .who .nm{font-family:var(--font-display);font-size:24px;line-height:1;}
  .who .rl{font-family:var(--font-mono);font-size:12px;color:var(--signal);text-transform:uppercase;letter-spacing:0.05em;margin-top:6px;display:inline-block;border:1px solid rgba(255,94,26,0.4);border-radius:999px;padding:3px 10px;}

  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;background:rgba(237,234,230,0.06);}
  @media(max-width:620px){.grid2{grid-template-columns:1fr;}}
  .drow{background:rgba(10,9,13,0.55);padding:16px 26px;display:flex;flex-direction:column;gap:4px;}
  .drow .k{font-family:var(--font-mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--steel);}
  .drow .v{font-size:15px;color:var(--bone);word-break:break-word;}
  .drow .v.empty{color:var(--steel);font-style:italic;}
  .drow input, .drow select{
    font-family:var(--font-body);font-size:14px;color:var(--bone);
    background:rgba(11,10,13,0.72);border:1px solid rgba(237,234,230,0.14);border-radius:8px;padding:8px 11px;outline:none;width:100%;
    transition:border-color .15s ease;
  }
  .drow input:focus, .drow select:focus{border-color:var(--signal);}

  .card-actions2{display:flex;gap:12px;padding:20px 26px;flex-wrap:wrap;}

  .empty-state{text-align:center;padding:60px 24px;}
  .empty-state .es-ico{width:70px;height:70px;border-radius:18px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,rgba(255,94,26,0.2),rgba(255,176,32,0.06));border:1px solid rgba(255,94,26,0.3);color:var(--ember);}
  .empty-state .es-ico svg{width:34px;height:34px;}
  .empty-state h3{font-family:var(--font-display);text-transform:uppercase;font-size:20px;margin:0 0 8px;}
  .empty-state p{color:var(--ash);margin:0 0 22px;}

  /* players search */
  .search-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
  .search-head p{color:var(--ash);font-size:14px;margin:0;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;}
  .fchip{font-family:var(--font-mono);font-size:11.5px;letter-spacing:0.04em;text-transform:uppercase;cursor:pointer;padding:7px 14px;border-radius:999px;border:1px solid rgba(237,234,230,0.14);background:rgba(20,18,24,0.6);color:var(--ash);transition:all .15s ease;}
  .fchip:hover{border-color:rgba(255,94,26,0.5);color:var(--bone);}
  .fchip.active{background:linear-gradient(120deg,var(--signal),var(--ember));color:var(--void);border-color:transparent;}

  .players{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media(max-width:820px){.players{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:520px){.players{grid-template-columns:1fr;}}
  .pcard{position:relative;border-radius:16px;padding:20px;border:1px solid rgba(237,234,230,0.08);background:linear-gradient(160deg, rgba(38,33,45,0.55), rgba(13,11,16,0.72));transition:transform .25s cubic-bezier(.2,.8,.2,1), border-color .25s ease, box-shadow .25s ease;}
  .pcard:hover{transform:translateY(-5px);border-color:rgba(255,94,26,0.45);box-shadow:0 20px 38px -16px rgba(0,0,0,0.85), 0 0 22px rgba(255,94,26,0.1);}
  .pcard.you{border-color:rgba(255,176,32,0.55);}
  .you-badge{position:absolute;top:14px;right:14px;font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--void);background:var(--ember);border-radius:999px;padding:3px 9px;}
  .pc-top{display:flex;align-items:center;gap:13px;margin-bottom:14px;}
  .pc-av{width:46px;height:46px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:19px;color:var(--void);background:linear-gradient(135deg,var(--signal),var(--ember));}
  .pc-top .pn{font-family:var(--font-display);font-size:18px;line-height:1;}
  .pc-top .pr{font-family:var(--font-mono);font-size:11px;color:var(--signal);text-transform:uppercase;margin-top:5px;}
  .pc-stats{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-family:var(--font-mono);font-size:12px;margin-bottom:16px;}
  .pc-stats .sk{color:var(--steel);text-transform:uppercase;letter-spacing:0.04em;}
  .pc-stats .sv{color:var(--bone);}
  .pc-online{display:inline-flex;align-items:center;gap:6px;}
  .pc-online::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--intel);box-shadow:0 0 8px 1px rgba(47,224,168,0.7);}
  .tg-btn{width:100%;justify-content:center;background:linear-gradient(100deg,#2aabee,#229ed9);color:#fff;}
  .tg-btn:hover{filter:brightness(1.08);}
  .tg-btn.disabled{background:var(--gunmetal-2);color:var(--steel);border:1px solid var(--steel);pointer-events:none;}
  .tg-btn svg{width:16px;height:16px;}

  /* tab count badge */
  .tab-count{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--signal);color:var(--void);font-size:11px;font-weight:800;line-height:1;margin-left:3px;}
  .tab.active .tab-count{background:var(--void);color:var(--ember);}

  /* like heart + match cards */
  .pcard{cursor:pointer;}
  .like-heart{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(237,234,230,0.14);background:rgba(11,10,13,0.6);color:var(--ash);cursor:pointer;transition:transform .16s ease, border-color .16s ease, color .16s ease, background .16s ease;z-index:2;}
  .like-heart svg{width:19px;height:19px;}
  .like-heart:hover{border-color:var(--signal);color:var(--signal);transform:scale(1.08);}
  .like-heart.liked{background:linear-gradient(120deg,var(--signal),var(--ember));border-color:transparent;color:var(--void);}
  .match-badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;color:var(--intel);border:1px solid rgba(47,224,168,0.4);background:rgba(47,224,168,0.08);border-radius:999px;padding:4px 10px;margin-bottom:13px;}
  .match-badge svg{width:13px;height:13px;}
  .match-badge.pending{color:var(--ember);border-color:rgba(255,176,32,0.4);background:rgba(255,176,32,0.08);}
  .like-back-btn{width:100%;justify-content:center;background:var(--gunmetal-2);color:var(--bone);border:1px solid var(--signal);margin-bottom:9px;}
  .like-back-btn:hover{background:rgba(255,94,26,0.12);}
  .like-back-btn svg{width:15px;height:15px;}

  /* player detail modal */
  .pmodal{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(6,5,9,0.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
  .pmodal.open{display:flex;animation:fadeIn .25s ease;}
  .pmodal-card{width:min(460px,100%);max-height:88vh;overflow:auto;position:relative;}
  .pm-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:10px;border:1px solid rgba(237,234,230,0.14);background:rgba(11,10,13,0.7);color:var(--ash);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:3;}
  .pm-close:hover{color:var(--bone);border-color:var(--signal);}
  .pm-close svg{width:16px;height:16px;}
  .pm-head{display:flex;align-items:center;gap:16px;padding:26px 26px 20px;border-bottom:1px solid rgba(237,234,230,0.08);}
  .pm-av{width:60px;height:60px;border-radius:15px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:24px;color:var(--void);background:linear-gradient(135deg,var(--signal),var(--ember));}
  .pm-nm{font-family:var(--font-display);font-size:22px;line-height:1;}
  .pm-rl{font-family:var(--font-mono);font-size:11px;color:var(--signal);text-transform:uppercase;margin-top:6px;display:inline-block;border:1px solid rgba(255,94,26,0.4);border-radius:999px;padding:3px 10px;}
  .pm-actions{padding:18px 26px 24px;display:flex;flex-direction:column;gap:10px;}
  .pm-actions .btn{width:100%;justify-content:center;}
  .pm-actions .btn svg{width:16px;height:16px;flex:none;}

  /* ============ MOBILE / PHONE ADAPTATION ============ */
  @media (max-width:640px){
    .nav .wrap{height:60px;}
    .brand-word{font-size:16px;}
    .nav .btn{font-size:11px;padding:9px 14px;}
    main{padding:26px 0 64px;}
    .page-title{font-size:clamp(22px,7vw,32px);margin-bottom:18px;}
    .tabs{gap:8px;}
    .tab{flex:1 1 46%;justify-content:center;padding:11px 12px;font-size:12px;}
    .profile-top{padding:20px 18px;}
    .who{gap:12px;}
    .avatar{width:54px;height:54px;font-size:22px;}
    .who .nm{font-size:20px;}
    #editBtn{width:100%;justify-content:center;}
    .grid2{grid-template-columns:1fr;}
    .drow{padding:13px 18px;}
    .card-actions2{padding:18px;}
    .card-actions2 .btn{flex:1 1 44%;justify-content:center;}
    .search-head p{font-size:13px;}
    .players{grid-template-columns:1fr;}
  }
  @media (max-width:380px){ .wrap{padding:0 15px;} }
</style>
</head>
<body>
<canvas class="ember-global" data-embers aria-hidden="true"></canvas>

<div class="bg-topo" data-topo aria-hidden="true"></div>

<script>
/* ---- procedural topographic contour lines (marching squares over value-noise) ---- */
(function(){
  const host = document.querySelector('[data-topo]');
  if(!host) return;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas=document.createElement('canvas');
  canvas.style.cssText='position:absolute;inset:0;width:100%;height:100%;display:block;';
  host.replaceChildren(canvas);
  const ctx=canvas.getContext('2d');
  const DPR=Math.min(window.devicePixelRatio||1,1.5);
  const cell=11, scale=0.0125;
  const levels=[]; for(let t=0.13;t<=0.87;t+=0.062) levels.push(t);
  function makeNoise(seed){
    function rand(x,y){ let n=(x|0)*374761393+(y|0)*668265263+seed*1274126177; n=(n^(n>>13))>>>0; n=(n*1274126177)>>>0; n=(n^(n>>16))>>>0; return n/4294967295; }
    const sm=t=>t*t*(3-2*t), lp=(a,b,t)=>a+(b-a)*t;
    function vn(x,y){ const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=sm(xf),v=sm(yf); return lp(lp(rand(xi,yi),rand(xi+1,yi),u),lp(rand(xi,yi+1),rand(xi+1,yi+1),u),v); }
    return function(x,y){ let a=1,f=1,s=0,nm=0; for(let o=0;o<2;o++){s+=a*vn(x*f,y*f);nm+=a;a*=0.45;f*=2;} return s/nm; };
  }
  const noise=makeNoise(9);
  let W=0,H=0,cols=0,rows=0,field=null,raf=null,ox=0,oy=0,last=0;
  function resize(){
    W=window.innerWidth; H=window.innerHeight; if(!W||!H) return;
    canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    cols=Math.ceil(W/cell)+2; rows=Math.ceil(H/cell)+2;
    field=new Float32Array(cols*rows);
  }
  function render(){
    if(!field) return;
    for(let j=0;j<rows;j++){ const sy=(j*cell+oy)*scale; for(let i=0;i<cols;i++){ field[j*cols+i]=noise((i*cell+ox)*scale,sy); } }
    const at=(i,j)=>field[j*cols+i];
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='#ffb267'; ctx.lineWidth=1.15; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    for(const lv of levels){
      for(let j=0;j<rows-1;j++){
        const y=j*cell;
        for(let i=0;i<cols-1;i++){
          const tl=at(i,j),tr=at(i+1,j),bl=at(i,j+1),br=at(i+1,j+1);
          let c=0; if(tl>lv)c|=8; if(tr>lv)c|=4; if(br>lv)c|=2; if(bl>lv)c|=1;
          if(c===0||c===15) continue;
          const x=i*cell;
          const top=[x+cell*((lv-tl)/(tr-tl)),y];
          const right=[x+cell,y+cell*((lv-tr)/(br-tr))];
          const bottom=[x+cell*((lv-bl)/(br-bl)),y+cell];
          const left=[x,y+cell*((lv-tl)/(bl-tl))];
          const seg=(a,b)=>{ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);};
          switch(c){
            case 1: case 14: seg(left,bottom); break;
            case 2: case 13: seg(bottom,right); break;
            case 3: case 12: seg(left,right); break;
            case 4: case 11: seg(top,right); break;
            case 6: case 9: seg(top,bottom); break;
            case 7: case 8: seg(left,top); break;
            case 5: seg(left,top); seg(bottom,right); break;
            case 10: seg(left,bottom); seg(top,right); break;
          }
        }
      }
    }
    ctx.stroke();
  }
  function loop(ts){ if(!last)last=ts; const dt=Math.min(50,ts-last); last=ts; ox+=dt*0.011; oy+=dt*0.005; render(); raf=requestAnimationFrame(loop); }
  resize(); render();
  if(!reduce){ last=0; raf=requestAnimationFrame(loop); }
  let rt; window.addEventListener('resize', function(){ clearTimeout(rt); rt=setTimeout(function(){ resize(); render(); },200); });
  document.addEventListener('visibilitychange', function(){ if(document.hidden){ if(raf){cancelAnimationFrame(raf);raf=null;} } else if(!reduce&&!raf){ last=0; raf=requestAnimationFrame(loop); } });
})();
</script>

<nav class="nav">
  <div class="wrap">
    <a class="brand" href="index.html">
      <svg viewBox="0 0 34 34" fill="none"><circle cx="17" cy="17" r="15" stroke="#ff5e1a" stroke-width="2"/><path d="M17 4V30 M4 17H30" stroke="#ffb020" stroke-width="1.4" opacity="0.6"/><circle cx="17" cy="17" r="4.5" fill="#ff5e1a"/></svg>
      <span class="brand-word">SKILL <span class="tag">FORGE</span></span>
    </a>
    <a class="btn btn-ghost" href="index.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg> На главную</a>
  </div>
</nav>

<main>
  <div class="wrap">
    <h1 class="page-title">Личный <span class="accent">кабинет</span></h1>

    <div class="tabs">
      <button class="tab active" data-tab="profile" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        Мой профиль
      </button>
      <button class="tab" data-tab="search" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        Поиск тиммейта
      </button>
      <button class="tab" data-tab="matches" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.2C.5 8 2 4.5 5.6 4c2-.3 3.8.7 4.9 2.3C11.6 4.7 13.4 3.7 15.4 4c3.6.5 5.1 4 3.6 7.8-2.5 4.6-10 9.2-10 9.2z"/></svg>
        Мэтчи
        <span class="tab-count" id="matchCount" style="display:none">0</span>
      </button>
    </div>

    <section class="tabpanel active" id="tab-profile"></section>

    <section class="tabpanel" id="tab-search">
      <div class="search-head">
        <p>Игроки, оставившие анкету. Найди того, кто подходит по роли и стилю, лайкни анкету или напиши ему.</p>
        <div class="filters" id="filters"></div>
      </div>
      <div class="players" id="players"></div>
    </section>

    <section class="tabpanel" id="tab-matches">
      <div class="search-head">
        <p>Игроки, которым понравилась твоя анкета. Ответь взаимностью — и пишите друг другу.</p>
      </div>
      <div class="players" id="matches"></div>
    </section>
  </div>
</main>

<div class="pmodal" id="pmodal" aria-hidden="true">
  <div class="glass pmodal-card" id="pmodalCard"></div>
</div>

<script>
(function(){
  /* ---- tabs ---- */
  const tabs = Array.from(document.querySelectorAll('.tab'));
  const panels = {profile:document.getElementById('tab-profile'), search:document.getElementById('tab-search'), matches:document.getElementById('tab-matches')};
  function selectTab(name){
    tabs.forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
    Object.keys(panels).forEach(k=>panels[k].classList.toggle('active', k===name));
    if(location.hash.replace('#','')!==name) history.replaceState(null,'','#'+name);
  }
  tabs.forEach(t=>t.addEventListener('click', ()=>selectTab(t.dataset.tab)));
  const initHash = location.hash.replace('#','');
  if(initHash==='search'||initHash==='matches') selectTab(initHash);

  /* ---- profile ---- */
  const FIELDS = [
    {key:'role',   label:'Роль',  type:'select', opts:['Fragger','IGL','Support','Sniper']},
    {key:'gameId', label:'Игровой ID', type:'text', ph:'0000000000'},
    {key:'kd',     label:'K/D', type:'text', ph:'3.5'},
    {key:'kdu',    label:'K/D Ultimate', type:'text', ph:'5.0'},
    {key:'device', label:'Устройство', type:'text', ph:'Телефон / Планшет / Эмулятор'},
    {key:'voice',  label:'Приложение для связи', type:'select', opts:['Discord','Parallel']},
    {key:'tg',     label:'Telegram', type:'text', ph:'@username'},
    {key:'age',    label:'Возраст', type:'text', ph:'18'}
  ];
  function loadProfile(){
    try{ return JSON.parse(localStorage.getItem('sf_profile')); }catch(_){ return null; }
  }
  function saveProfile(p){ try{ localStorage.setItem('sf_profile', JSON.stringify(p)); }catch(_){} }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  const panel = panels.profile;

  function renderEmpty(){
    panel.innerHTML =
      '<div class="glass empty-state">'+
        '<div class="es-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7 1.4 0 2.7.3 3.8.9"/><path d="M19 14v6M16 17h6"/></svg></div>'+
        '<h3>Профиль ещё не создан</h3>'+
        '<p>Заполни анкету на главной, чтобы появиться в поиске тиммейтов.</p>'+
        '<a class="btn btn-primary" href="index.html#search">Создать профиль →</a>'+
      '</div>';
  }

  function renderView(p){
    let rows = FIELDS.map(f=>{
      const v = p[f.key];
      const disp = v ? esc(v) : '<span class="v empty">не указано</span>';
      return '<div class="drow"><span class="k">'+f.label+'</span>'+(v?'<span class="v">'+esc(v)+'</span>':disp)+'</div>';
    }).join('');
    const initial = esc((p.nick||'И').charAt(0).toUpperCase());
    panel.innerHTML =
      '<div class="glass">'+
        '<div class="profile-top">'+
          '<div class="who"><div class="avatar">'+initial+'</div><div><div class="nm">'+esc(p.nick||'Игрок')+'</div><span class="rl">Role: '+esc(p.role||'—')+'</span></div></div>'+
          '<button class="btn btn-primary" id="editBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M13.5 6.5l3 3"/></svg> Редактировать профиль</button>'+
        '</div>'+
        '<div class="grid2">'+rows+'</div>'+
      '</div>';
    document.getElementById('editBtn').addEventListener('click', ()=>renderEdit(p));
  }

  function renderEdit(p){
    let rows = ['<div class="drow"><span class="k">Никнейм</span><input id="f-nick" type="text" value="'+esc(p.nick||'')+'" placeholder="Твой ник"></div>'];
    rows = rows.concat(FIELDS.map(f=>{
      let ctrl;
      if(f.type==='select'){
        ctrl = '<select id="f-'+f.key+'">'+f.opts.map(o=>'<option'+(o===p[f.key]?' selected':'')+'>'+o+'</option>').join('')+'</select>';
      } else {
        ctrl = '<input id="f-'+f.key+'" type="text" value="'+esc(p[f.key]||'')+'" placeholder="'+esc(f.ph||'')+'">';
      }
      return '<div class="drow"><span class="k">'+f.label+'</span>'+ctrl+'</div>';
    }));
    panel.innerHTML =
      '<div class="glass">'+
        '<div class="profile-top"><div class="who"><div class="avatar">'+esc((p.nick||'И').charAt(0).toUpperCase())+'</div><div><div class="nm">Редактирование</div><span class="rl">Обнови свои данные</span></div></div></div>'+
        '<div class="grid2">'+rows.join('')+'</div>'+
        '<div class="card-actions2">'+
          '<button class="btn btn-primary" id="saveBtn">Сохранить</button>'+
          '<button class="btn btn-ghost" id="cancelBtn">Отмена</button>'+
        '</div>'+
      '</div>';
    document.getElementById('saveBtn').addEventListener('click', ()=>{
      const g = id => (document.getElementById(id)||{}).value || '';
      const np = Object.assign({}, p, {
        nick: g('f-nick').trim() || 'Игрок',
        role: g('f-role'), gameId: g('f-gameId').trim(), kd: g('f-kd').trim(),
        device: g('f-device').trim(), voice: g('f-voice').trim(), tg: g('f-tg').trim(), age: g('f-age').trim()
      });
      saveProfile(np); renderView(np); refreshAll();
    });
    document.getElementById('cancelBtn').addEventListener('click', ()=>renderView(p));
  }

  const myProfile = loadProfile();
  if(myProfile) renderView(myProfile); else renderEmpty();

  /* ---- teammate search ---- */
  const MOCK = [
    {nick:'wizard777', role:'IGL', gameId:'5217830194', kd:'4.2', kdu:'5.6', device:'Телефон', voice:'Discord', tg:'@wizard777', age:'21', online:'Вечер', likedYou:true},
    {nick:'mrFROSTY', role:'Fragger', gameId:'5688201475', kd:'5.1', kdu:'6.8', device:'Эмулятор', voice:'Parallel', tg:'@frosty_ace', age:'24', online:'Ночь'},
    {nick:'MEXICANEC', role:'Support', gameId:'5109384726', kd:'3.4', kdu:'4.1', device:'Планшет', voice:'Discord', tg:'@mexicanec', age:'19', online:'Утро', likedYou:true},
    {nick:'ShadowReaper', role:'Fragger', gameId:'5473019286', kd:'4.8', kdu:'6.2', device:'Телефон', voice:'Parallel', tg:'@shadow_rpr', age:'22', online:'День'},
    {nick:'nightstalk', role:'Sniper', gameId:'5990172634', kd:'3.9', kdu:'4.7', device:'Телефон', voice:'Discord', tg:'@nightstalk', age:'20', online:'Ночь', likedYou:true},
    {nick:'AceHunter', role:'Fragger', gameId:'5342087611', kd:'6.0', kdu:'7.5', device:'Эмулятор', voice:'Discord', tg:'@acehunter', age:'23', online:'Вечер'}
  ];
  const ROLES = ['Все','Fragger','IGL','Support','Sniper'];
  let activeRole = 'Все';

  /* likes persistence */
  function loadLikes(){ try{ return JSON.parse(localStorage.getItem('sf_likes')) || []; }catch(_){ return []; } }
  function saveLikes(a){ try{ localStorage.setItem('sf_likes', JSON.stringify(a)); }catch(_){} }
  function isLiked(nick){ return loadLikes().indexOf(nick) >= 0; }
  function toggleLike(nick){ const a=loadLikes(); const i=a.indexOf(nick); if(i>=0)a.splice(i,1); else a.push(nick); saveLikes(a); }

  function tgLink(tg){ if(!tg) return null; return 'https://t.me/'+tg.replace(/^@/,''); }
  function heartSvg(){ return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.2C.5 8 2 4.5 5.6 4c2-.3 3.8.7 4.9 2.3C11.6 4.7 13.4 3.7 15.4 4c3.6.5 5.1 4 3.6 7.8-2.5 4.6-10 9.2-10 9.2z"/></svg>'; }
  function closeSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'; }
  function initial(nick){ return esc((nick||'И').charAt(0).toUpperCase()); }

  function tgBtnHTML(tg){
    const link = tgLink(tg);
    return link
      ? '<a class="btn tg-btn" href="'+link+'" target="_blank" rel="noopener" data-stop><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.5L18.5 20c-.25 1.1-.92 1.37-1.86.85l-5.14-3.79-2.48 2.39c-.27.27-.5.5-1.03.5l.37-5.23L17.9 6.2c.42-.37-.09-.58-.65-.21L6.14 12.9l-5.06-1.58c-1.1-.34-1.12-1.1.23-1.63L20.5 2.9c.92-.34 1.72.21 1.4 1.6z"/></svg> Написать в Telegram</a>'
      : '<span class="btn tg-btn disabled">Telegram не указан</span>';
  }
  function statsHTML(p){
    return '<div class="pc-stats">'+
      '<span class="sk">K/D</span><span class="sv">'+esc(p.kd||'—')+'</span>'+
      '<span class="sk">K/D Ult</span><span class="sv">'+esc(p.kdu||'—')+'</span>'+
      '<span class="sk">Устройство</span><span class="sv">'+esc(p.device||'—')+'</span>'+
      '<span class="sk">Голос</span><span class="sv">'+esc(p.voice||'—')+'</span>'+
      '<span class="sk">Онлайн</span><span class="sv"><span class="pc-online">'+esc(p.online||'—')+'</span></span>'+
    '</div>';
  }
  function playerCardHTML(p, mode){
    const liked = isLiked(p.nick);
    let topRight = p.you
      ? '<span class="you-badge">Это вы</span>'
      : '<button class="like-heart'+(liked?' liked':'')+'" data-like="'+esc(p.nick)+'" data-stop aria-label="Лайкнуть анкету">'+heartSvg()+'</button>';
    let matchLine = '', actions = '';
    if(mode==='match'){
      if(liked){
        matchLine = '<div class="match-badge">'+heartSvg()+' Взаимный мэтч</div>';
        actions = tgBtnHTML(p.tg);
      } else {
        matchLine = '<div class="match-badge pending">'+heartSvg()+' Лайкнул твою анкету</div>';
        actions = '<button class="btn like-back-btn" data-like="'+esc(p.nick)+'" data-stop>'+heartSvg()+' Лайкнуть в ответ</button>'+tgBtnHTML(p.tg);
      }
    } else {
      actions = tgBtnHTML(p.tg);
    }
    return '<div class="pcard'+(p.you?' you':'')+'" data-open="'+esc(p.nick)+'">'+
      topRight+ matchLine+
      '<div class="pc-top"><div class="pc-av">'+initial(p.nick)+'</div><div><div class="pn">'+esc(p.nick||'Игрок')+'</div><div class="pr">Role: '+esc(p.role||'—')+'</div></div></div>'+
      statsHTML(p)+ actions+
    '</div>';
  }

  function findPlayer(nick){
    const mine = loadProfile();
    if(mine && (mine.nick||'Игрок')===nick) return Object.assign({you:true, online:'Сейчас'}, mine);
    return MOCK.filter(x=>x.nick===nick)[0] || null;
  }

  /* full-info modal */
  const DETAIL = [
    ['Роль','role'],['Игровой ID','gameId'],['K/D','kd'],['K/D Ultimate','kdu'],
    ['Устройство','device'],['Приложение для связи','voice'],['Telegram','tg'],['Возраст','age'],['Онлайн','online']
  ];
  const modal = document.getElementById('pmodal');
  const modalCard = document.getElementById('pmodalCard');
  function openModal(p){
    const liked = isLiked(p.nick);
    const rows = DETAIL.map(function(f){
      const v = p[f[1]];
      return '<div class="drow"><span class="k">'+f[0]+'</span>'+(v?'<span class="v">'+esc(v)+'</span>':'<span class="v empty">не указано</span>')+'</div>';
    }).join('');
    const likeBtn = p.you ? '' : '<button class="btn '+(liked?'btn-primary':'btn-ghost')+'" id="pmLike">'+heartSvg()+' '+(liked?'Вы лайкнули':'Лайкнуть анкету')+'</button>';
    modalCard.innerHTML =
      '<button class="pm-close" id="pmClose" aria-label="Закрыть">'+closeSvg()+'</button>'+
      '<div class="pm-head"><div class="pm-av">'+initial(p.nick)+'</div><div><div class="pm-nm">'+esc(p.nick||'Игрок')+'</div><span class="pm-rl">Role: '+esc(p.role||'—')+'</span></div></div>'+
      '<div class="grid2">'+rows+'</div>'+
      '<div class="pm-actions">'+likeBtn+tgBtnHTML(p.tg)+'</div>';
    modal.classList.add('open'); modal.setAttribute('aria-hidden','false');
    document.getElementById('pmClose').addEventListener('click', closeModal);
    const lb = document.getElementById('pmLike');
    if(lb) lb.addEventListener('click', function(){ toggleLike(p.nick); refreshAll(); openModal(findPlayer(p.nick)); });
  }
  function closeModal(){ modal.classList.remove('open'); modal.setAttribute('aria-hidden','true'); }
  modal.addEventListener('click', function(e){ if(e.target===modal) closeModal(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && modal.classList.contains('open')) closeModal(); });

  function bindGrid(grid){
    grid.querySelectorAll('.pcard').forEach(function(card){
      card.addEventListener('click', function(e){
        if(e.target.closest('[data-stop]')) return;
        const p = findPlayer(card.getAttribute('data-open'));
        if(p) openModal(p);
      });
    });
    grid.querySelectorAll('[data-like]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.preventDefault(); e.stopPropagation();
        toggleLike(btn.getAttribute('data-like'));
        refreshAll();
      });
    });
  }

  const filtersEl = document.getElementById('filters');
  filtersEl.innerHTML = ROLES.map((r,i)=>'<button class="fchip'+(i===0?' active':'')+'" data-role="'+r+'" type="button">'+r+'</button>').join('');
  filtersEl.querySelectorAll('.fchip').forEach(c=>c.addEventListener('click',()=>{
    activeRole=c.dataset.role;
    filtersEl.querySelectorAll('.fchip').forEach(x=>x.classList.toggle('active',x===c));
    renderPlayers();
  }));

  function renderPlayers(){
    const mine = loadProfile();
    let list = MOCK.slice();
    if(mine){ list.unshift(Object.assign({you:true, online:'Сейчас'}, mine)); }
    if(activeRole!=='Все') list = list.filter(p=>p.role===activeRole);
    const grid = document.getElementById('players');
    if(!list.length){ grid.innerHTML = '<p style="color:var(--ash)">Никого с такой ролью пока нет.</p>'; return; }
    grid.innerHTML = list.map(p=>playerCardHTML(p,'search')).join('');
    bindGrid(grid);
  }

  function incomingLikes(){ return loadProfile() ? MOCK.filter(p=>p.likedYou) : []; }
  function emptyMatchesHTML(msg){
    return '<div class="glass empty-state" style="grid-column:1/-1">'+
      '<div class="es-ico">'+heartSvg()+'</div>'+
      '<h3>Мэтчей пока нет</h3><p>'+esc(msg)+'</p>'+
      (loadProfile()?'':'<a class="btn btn-primary" href="index.html#search">Создать профиль →</a>')+
    '</div>';
  }
  function renderMatches(){
    const grid = document.getElementById('matches');
    if(!loadProfile()){ grid.innerHTML = emptyMatchesHTML('Создай профиль, чтобы игроки могли находить и лайкать твою анкету.'); return; }
    const list = incomingLikes();
    if(!list.length){ grid.innerHTML = emptyMatchesHTML('Пока никто не лайкнул твою анкету. Загляни позже или сам полайкай игроков в поиске.'); return; }
    grid.innerHTML = list.map(p=>playerCardHTML(p,'match')).join('');
    bindGrid(grid);
  }
  function updateMatchCount(){
    const el = document.getElementById('matchCount');
    const n = incomingLikes().length;
    if(n>0){ el.textContent = n; el.style.display=''; } else { el.style.display='none'; }
  }

  function refreshAll(){ renderPlayers(); renderMatches(); updateMatchCount(); }
  refreshAll();
})();

/* embers */
(function(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('canvas[data-embers]').forEach(function(canvas){
    const ctx=canvas.getContext('2d');let w,h,particles=[],raf=null;const DPR=Math.min(window.devicePixelRatio||1,2);
    function resize(){const r=canvas.getBoundingClientRect();w=r.width;h=r.height;canvas.width=w*DPR;canvas.height=h*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);const c=Math.round(Math.min(90,Math.max(36,w*h/16000)));particles=Array.from({length:c},makeP);}
    function makeP(){return {x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.8+0.4,vy:-(Math.random()*0.5+0.15),vx:(Math.random()-0.5)*0.4,life:Math.random(),flick:Math.random()*0.04+0.01,hue:Math.random()>0.5?28:18};}
    function tick(){ctx.clearRect(0,0,w,h);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.life+=p.flick;p.vx+=(Math.random()-0.5)*0.02;if(p.y<-6||p.x<-6||p.x>w+6){Object.assign(p,makeP(),{y:h+6,x:Math.random()*w});}const a=0.35+Math.abs(Math.sin(p.life))*0.55;const gr=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3.2);gr.addColorStop(0,'hsla('+p.hue+',100%,62%,'+a+')');gr.addColorStop(1,'hsla('+p.hue+',100%,50%,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(p.x,p.y,p.r*3.2,0,Math.PI*2);ctx.fill();ctx.fillStyle='hsla('+p.hue+',100%,80%,'+a+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r*0.7,0,Math.PI*2);ctx.fill();}raf=requestAnimationFrame(tick);}
    let rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(resize,150);});resize();tick();
  });
})();
</script>
</body>
</html>
